/* ==========================================================
   UTILIDADES
========================================================== */

function escapar(valor) {

  return String(
    valor ?? ""
  )

    .replaceAll(
      "&",
      "&amp;"
    )

    .replaceAll(
      "<",
      "&lt;"
    )

    .replaceAll(
      ">",
      "&gt;"
    )

    .replaceAll(
      '"',
      "&quot;"
    )

    .replaceAll(
      "'",
      "&#039;"
    );
}


function normalizar(texto) {

  return String(
    texto ?? ""
  )

    .normalize(
      "NFD"
    )

    .replace(
      /[\u0300-\u036f]/g,
      ""
    )

    .toUpperCase()

    .replace(
      /[^A-Z0-9]/g,
      ""
    );
}


function textoLimpio(valor) {

  if (
    valor === null ||
    valor === undefined
  ) {

    return "";

  }

  return String(
    valor
  ).trim();
}


function numeroSeguro(valor) {

  const texto =
    textoLimpio(
      valor
    )

      .replace(
        /\s/g,
        ""
      )

      .replace(
        /\./g,
        ""
      )

      .replace(
        ",",
        "."
      );

  if (!texto) {

    return null;

  }

  const numero =
    Number(
      texto
    );

  return Number.isNaN(
    numero
  )
    ? null
    : numero;
}


function fechaUY(fecha) {

  if (!fecha) {

    return "-";

  }

  const partes =
    String(
      fecha
    ).split(
      "-"
    );

  if (
    partes.length !== 3
  ) {

    return escapar(
      fecha
    );

  }

  return (
    partes[2] +
    "/" +
    partes[1] +
    "/" +
    partes[0]
  );
}


function nombreEstado(
  estado
) {

  const mapa = {

    borrador:
      "Borrador",

    votacion_abierta:
      "Votación abierta",

    votacion_cerrada:
      "Votación cerrada",

    resultado_provisorio:
      "Resultado provisorio",

    resultado_definitivo:
      "Resultado definitivo"

  };

  return (
    mapa[estado] ||
    estado
  );
}


function headersAdmin(
  extra = {}
) {

  return {

    apikey:
      SUPABASE_KEY,

    Authorization:
      "Bearer " +
      sesionAdmin.access_token,

    "Content-Type":
      "application/json",

    ...extra

  };
}


/* ==========================================================
   SUPABASE
========================================================== */

async function apiGet(
  ruta
) {

  const respuesta =
    await fetch(

      SUPABASE_URL +
      "/rest/v1/" +
      ruta,

      {

        headers:
          headersAdmin()

      }

    );

  if (
    !respuesta.ok
  ) {

    throw new Error(
      await respuesta.text()
    );

  }

  return respuesta.json();
}


async function apiPost(
  tabla,
  datos
) {

  const respuesta =
    await fetch(

      SUPABASE_URL +
      "/rest/v1/" +
      tabla,

      {

        method:
          "POST",

        headers:
          headersAdmin({

            Prefer:
              "return=representation"

          }),

        body:
          JSON.stringify(
            datos
          )

      }

    );

  const texto =
    await respuesta.text();

  if (
    !respuesta.ok
  ) {

    throw new Error(
      texto
    );

  }

  return texto
    ? JSON.parse(
        texto
      )
    : [];
}


async function apiPatch(
  tabla,
  filtro,
  datos
) {

  const respuesta =
    await fetch(

      SUPABASE_URL +
      "/rest/v1/" +
      tabla +
      "?" +
      filtro,

      {

        method:
          "PATCH",

        headers:
          headersAdmin({

            Prefer:
              "return=representation"

          }),

        body:
          JSON.stringify(
            datos
          )

      }

    );

  const texto =
    await respuesta.text();

  if (
    !respuesta.ok
  ) {

    throw new Error(
      texto
    );

  }

  return texto
    ? JSON.parse(
        texto
      )
    : [];
}


/* ==========================================================
   SESIÓN ADMIN
========================================================== */

async function iniciarSesion(
  email,
  password
) {

  const respuesta =
    await fetch(

      SUPABASE_URL +
      "/auth/v1/token?grant_type=password",

      {

        method:
          "POST",

        headers: {

          apikey:
            SUPABASE_KEY,

          "Content-Type":
            "application/json"

        },

        body:
          JSON.stringify({

            email,
            password

          })

      }

    );

  const datos =
    await respuesta.json();

  if (
    !respuesta.ok
  ) {

    throw new Error(
      "Email o contraseña incorrectos."
    );

  }

  sesionAdmin =
    datos;

  localStorage.setItem(

    "sesionAdminSdU",

    JSON.stringify(
      datos
    )

  );

  return true;
}


async function renovarSesion() {

  const guardada =
    localStorage.getItem(
      "sesionAdminSdU"
    );

  if (!guardada) {

    return false;

  }

  try {

    const anterior =
      JSON.parse(
        guardada
      );

    if (
      !anterior.refresh_token
    ) {

      return false;

    }

    const respuesta =
      await fetch(

        SUPABASE_URL +
        "/auth/v1/token?grant_type=refresh_token",

        {

          method:
            "POST",

          headers: {

            apikey:
              SUPABASE_KEY,

            "Content-Type":
              "application/json"

          },

          body:
            JSON.stringify({

              refresh_token:
                anterior.refresh_token

            })

        }

      );

    if (
      !respuesta.ok
    ) {

      return false;

    }

    sesionAdmin =
      await respuesta.json();

    localStorage.setItem(

      "sesionAdminSdU",

      JSON.stringify(
        sesionAdmin
      )

    );

    return true;

  } catch {

    return false;

  }
}

/* ==========================================================
   EXCEL
========================================================== */

function normalizarCabecera(
  texto
) {

  return normalizar(
    texto
  );
}


function buscarCampo(
  fila,
  candidatos
) {

  const claves =
    Object.keys(
      fila
    );


  for (
    const candidato
    of candidatos
  ) {

    const objetivo =
      normalizarCabecera(
        candidato
      );


    const clave =
      claves.find(

        k =>
          normalizarCabecera(
            k
          ) ===
          objetivo

      );


    if (
      clave !== undefined
    ) {

      return fila[
        clave
      ];

    }

  }


  return "";
}

function extraerResultado(

) {

  const puestoBruto =
    textoLimpio(

      buscarCampo(

        fila,

        [
          "#",
          "PUESTO",
          "POSICION",
          "POSICIÓN",
          "RESULTADO",
          "CLASIFICACION",
          "CLASIFICACIÓN"
        ]

      )

    );


  let estado =
    "clasificado";


  let puesto =
    null;


  const puestoNorm =
    normalizar(
      puestoBruto
    );


  if (

    puestoNorm === "NC" ||

    puestoNorm.includes(
      "NOCLASIFIC"
    )

  ) {

    estado =
      "NC";

  }

  else if (

    puestoNorm === "DQ" ||

    puestoNorm.includes(
      "DESCALIFIC"
    )

  ) {

    estado =
      "DQ";

  }

  else if (

    puestoNorm.includes(
      "RETIR"
    )

  ) {

    estado =
      "retirado";

  }

  else {

    const n =
      parseInt(
        puestoBruto,
        10
      );


    puesto =
      Number.isNaN(
        n
      )

        ? null

        : n;

  }


  return {

    equino:
      textoLimpio(

        buscarCampo(

/* ==========================================================
   LECTOR EXCEL
========================================================== */

async function leerExcel(
  archivo,
  tipo
) {

  const buffer =
    await archivo.arrayBuffer();


  const libro =
    XLSX.read(

      buffer,

      {
        type:
          "array"
      }

    );


  let mejor =
    null;


  for (
    const nombreHoja
    of libro.SheetNames
  ) {

    const hoja =
      libro.Sheets[
        nombreHoja
      ];


    const matriz =
      XLSX.utils
        .sheet_to_json(

          hoja,

          {

            header:
              1,

            defval:
              "",

            raw:
              false

          }

        );


    if (
      !matriz.length
    ) {

      continue;

    }


    let filaEncabezado =
      -1;


    const limite =
      Math.min(

        matriz.length,

        40

      );


    for (
      let i = 0;
      i < limite;
      i++
    ) {

      const fila =
        matriz[i];


      const normalizados =
        fila.map(

          celda =>
            normalizarCabecera(
              celda
            )

        );


      const tieneEquino =
        normalizados.some(

          x =>
            x ===
              "EQUINO" ||

            x ===
              "CABALLO" ||

            x ===
              "NOMBREEQUINO"

        );


      if (
        tieneEquino
      ) {

        filaEncabezado =
          i;

        break;

      }

    }


    if (
      filaEncabezado ===
      -1
    ) {

      continue;

    }


    const filas =
      XLSX.utils
        .sheet_to_json(

          hoja,

          {

            range:
              filaEncabezado,

            defval:
              "",

            raw:
              false

          }

        );


    if (
      !filas.length
    ) {

      continue;

    }


    const procesadas =
      filas

        .map(

          tipo ===
          "nomina"

            ? extraerNomina

            : extraerResultado

        )

        .filter(

          x =>
            x.equino &&

            normalizar(
              x.equino
            ) !==
              "EQUINO"

        );


    if (

      !mejor ||

      procesadas.length >
        mejor.filas.length

    ) {

      mejor = {

        hoja:
          nombreHoja,

        filaEncabezado:
          filaEncabezado +
          1,

        filas:
          procesadas

      };

    }

  }


  if (

    !mejor ||

    !mejor.filas.length

  ) {

    throw new Error(
      "No encontré la tabla de caballos en el Excel."
    );

  }


  return mejor;
}

/* ==========================================================
   COINCIDENCIAS DE CABALLOS
========================================================== */

function candidatosCaballo(
  fila,
  base
) {

  const candidatos =
    [];


  const chip =
    textoLimpio(
      fila.chip
    );


  const pasaporte =
    textoLimpio(
      fila.pasaporte
    );


  const nombreNorm =
    normalizar(
      fila.equino
    );


  if (chip) {

    base.deportivos

      .filter(

        x =>
          textoLimpio(
            x.chip
          ) ===
          chip

      )

      .forEach(

        x => {

          candidatos.push({

            tipo:
              "deportivo",

            id:
              x.id,

            nombre:
              x.nombre_principal,

            prioridad:
              1

          });

        }

      );

  }


  if (
    pasaporte
  ) {

    base.deportivos

      .filter(

        x =>
          textoLimpio(
            x.pasaporte_feu
          ) ===
          pasaporte

      )

      .forEach(

        x => {

          candidatos.push({

            tipo:
              "deportivo",

            id:
              x.id,

            nombre:
              x.nombre_principal,

            prioridad:
              2

          });

        }

      );

  }


  base.deportivos

    .filter(

      x =>
        normalizar(
          x.nombre_principal
        ) ===
        nombreNorm

    )

    .forEach(

      x => {

        candidatos.push({

          tipo:
            "deportivo",

          id:
            x.id,

          nombre:
            x.nombre_principal,

          prioridad:
            3

        });

      }

    );


  base.aliases

    .filter(

      a =>
        normalizar(
          a.alias
        ) ===
        nombreNorm

    )

    .forEach(

      a => {

        const dep =
          base.deportivos
            .find(

              d =>
                Number(
                  d.id
                ) ===

                Number(
                  a.caballo_deportivo_id
                )

            );


        if (dep) {

          candidatos.push({

            tipo:
              "deportivo",

            id:
              dep.id,

            nombre:
              dep.nombre_principal +
              " (" +
              a.alias +
              ")",

            prioridad:
              4

          });

        }

      }

    );


  base.registrados

    .filter(

      x =>
        normalizar(
          x.Nombre
        ) ===
        nombreNorm

    )

    .forEach(

      x => {

        candidatos.push({

          tipo:
            "registrado",

          id:
            x.id,

          nombre:
            x.Nombre,

          prioridad:
            5

        });

      }

    );


  const unicos =
    [];


  const claves =
    new Set();


  candidatos

    .sort(

      (a,b) =>
        a.prioridad -
        b.prioridad

    )

    .forEach(

      c => {

        const clave =
          c.tipo +
          ":" +
          c.id;


        if (
          !claves.has(
            clave
          )
        ) {

          claves.add(
            clave
          );

          unicos.push(
            c
          );

        }

      }

    );


  return unicos;
}

/* ==========================================================
   CREAR / OBTENER CABALLO DEPORTIVO
========================================================== */

async function obtenerOCrearDeportivo(
  fila
) {

  const seleccion =
    fila.seleccion;


  if (
    seleccion.startsWith(
      "deportivo:"
    )
  ) {

    const id =
      Number(

        seleccion
          .split(
            ":"
          )[1]

      );


    const actuales =
      await apiGet(

        "caballos_deportivos" +
        "?select=*" +
        "&id=eq." +
        id +
        "&limit=1"

      );


    const actual =
      actuales[0];


    if (actual) {

      const cambios =
        {};


      if (
        !actual.chip &&
        fila.chip
      ) {

        cambios.chip =
          fila.chip;

      }


      if (
        !actual.pasaporte_feu &&
        fila.pasaporte
      ) {

        cambios.pasaporte_feu =
          fila.pasaporte;

      }


      if (
        !actual.propietario_actual &&
        fila.propietario
      ) {

        cambios.propietario_actual =
          fila.propietario;

      }


      if (
        Object.keys(
          cambios
        ).length
      ) {

        cambios.updated_at =
          new Date()
            .toISOString();


        await apiPatch(

          "caballos_deportivos",

          "id=eq." +
          id,

          cambios

        );

      }

    }


    return id;

  }


  if (
    seleccion.startsWith(
      "registrado:"
    )
  ) {

    const caballoId =
      Number(

        seleccion
          .split(
            ":"
          )[1]

      );


    const existentes =
      await apiGet(

        "caballos_deportivos" +
        "?select=*" +
        "&caballo_id=eq." +
        caballoId +
        "&limit=1"

      );


    if (
      existentes.length
    ) {

      return (
        existentes[0].id
      );

    }


    const creado =
      await apiPost(

        "caballos_deportivos",

        {

          caballo_id:
            caballoId,

          nombre_principal:
            fila.equino,

          nombre_normalizado:
            normalizar(
              fila.equino
            ),

          chip:
            fila.chip ||
            null,

          pasaporte_feu:
            fila.pasaporte ||
            null,

          propietario_actual:
            fila.propietario ||
            null

        }

      );


    return (
      creado[0].id
    );

  }


  const creado =
    await apiPost(

      "caballos_deportivos",

      {

        caballo_id:
          null,

        nombre_principal:
          fila.equino,

        nombre_normalizado:
          normalizar(
            fila.equino
          ),

        chip:
          fila.chip ||
          null,

        pasaporte_feu:
          fila.pasaporte ||
          null,

        propietario_actual:
          fila.propietario ||
          null

      }

    );


  return (
    creado[0].id
  );
}


/* ==========================================================
   GUARDAR NÓMINA
========================================================== */

async function guardarNomina(
  nombreArchivo
) {

  const boton =
    document
      .getElementById(
        "btnGuardarNomina"
      );


  const mensaje =
    document
      .getElementById(
        "mensajeGuardarNomina"
      );


  boton.disabled =
    true;


  mensaje.innerHTML = `

    <div class="mensaje">

      Guardando nómina...

    </div>

  `;


  try {


    const participantesActuales =
      await apiGet(

        "participantes_competencia" +
        "?select=*" +
        "&competencia_id=eq." +
        competenciaActual.id

      );


    for (
      const fila
      of previewNomina
    ) {


      const depId =
        await obtenerOCrearDeportivo(
          fila
        );


      const duplicado =
        participantesActuales.find(

          p =>

            (

              fila.chip &&

              textoLimpio(
                p.chip
              ) ===
              fila.chip

            )

            ||

            (

              fila.pasaporte &&

              textoLimpio(
                p.pasaporte_feu
              ) ===
              fila.pasaporte

            )

            ||

            (

              normalizar(
                p.nombre_nomina
              ) ===

              normalizar(
                fila.equino
              )

            )

        );


      /*
        SI EL PARTICIPANTE YA EXISTE:
        lo actualizamos.
      */
      if (
        duplicado
      ) {


        await apiPatch(

          "participantes_competencia",

          "id=eq." +
          duplicado.id,

          {

            caballo_deportivo_id:
              depId,


            numero_marcacion:
              fila.numero_marcacion ||
              duplicado.numero_marcacion ||
              null,


            nombre_nomina:
              fila.equino,


            nombre_normalizado:
              normalizar(
                fila.equino
              ),


            propietario_nomina:
              fila.propietario ||
              duplicado.propietario_nomina ||
              null,


            jinete:
              fila.jinete ||
              duplicado.jinete ||
              null,


            club:
              fila.club ||
              duplicado.club ||
              null,


            chip:
              fila.chip ||
              duplicado.chip ||
              null,


            pasaporte_feu:
              fila.pasaporte ||
              duplicado.pasaporte_feu ||
              null,


            genero:
              fila.genero ||
              duplicado.genero ||
              null,


            fila_origen:
              fila.fila_origen

          }

        );


        continue;

      }


      /*
        SI ES NUEVO:
        lo creamos.
      */
      const creado =
        await apiPost(

          "participantes_competencia",

          {

            competencia_id:
              competenciaActual.id,


            caballo_deportivo_id:
              depId,


            numero_marcacion:
              fila.numero_marcacion ||
              null,


            nombre_nomina:
              fila.equino,


            nombre_normalizado:
              normalizar(
                fila.equino
              ),


            propietario_nomina:
              fila.propietario ||
              null,


            jinete:
              fila.jinete ||
              null,


            club:
              fila.club ||
              null,


            chip:
              fila.chip ||
              null,


            pasaporte_feu:
              fila.pasaporte ||
              null,


            genero:
              fila.genero ||
              null,


            fila_origen:
              fila.fila_origen

          }

        );


      if (
        creado &&
        creado[0]
      ) {

        participantesActuales.push(
          creado[0]
        );

      }

    }


    await apiPatch(

      "competencias",

      "id=eq." +
      competenciaActual.id,

      {

        archivo_origen:
          nombreArchivo,

        updated_at:
          new Date()
            .toISOString()

      }

    );


    mensaje.innerHTML = `

      <div
        class="mensaje mensaje-exito"
      >

        Nómina guardada correctamente.

      </div>

    `;


    await listarParticipantes(
      competenciaActual.id
    );


  } catch (error) {


    console.error(
      error
    );


    mensaje.innerHTML = `

      <div
        class="mensaje mensaje-error"
      >

        No se pudo guardar
        la nómina.

        <br><br>

        ${escapar(
          error.message
        )}

      </div>

    `;

  }


  boton.disabled =
    false;
}

/* ==========================================================
   GUARDAR RESULTADOS
========================================================== */

async function guardarResultados(
  nombreArchivo
) {

  const mensaje =
    document
      .getElementById(
        "mensajeResultados"
      );


  const sinRelacion =
    previewResultados.filter(

      x =>
        !x.participante_id

    );


  if (
    sinRelacion.length
  ) {

    alert(
      "Hay resultados sin participante relacionado."
    );

    return;

  }


  mensaje.innerHTML = `

    <div class="mensaje">

      Guardando resultados...

    </div>

  `;


  try {


    for (
      const fila
      of previewResultados
    ) {


      const existentes =
        await apiGet(

          "resultados_competencia" +
          "?select=*" +
          "&participante_id=eq." +
          fila.participante_id +
          "&limit=1"

        );


      const datos = {


        puesto:

          fila.estado ===
          "clasificado"

            ? fila.puesto

            : null,


        estado_resultado:
          fila.estado,


        promedio_kmh:
          fila.promedio,


        tiempo:
          fila.tiempo ||
          null,


        observaciones:
          fila.observaciones ||
          null,


        updated_at:
          new Date()
            .toISOString()

      };


      /*
        SI YA EXISTE EL RESULTADO:
        actualiza el resultado vigente,
        pero conserva el original.
      */
      if (
        existentes.length
      ) {


        const existente =
          existentes[0];


        const cambios = {

          ...datos

        };


        if (

          existente.puesto_original ===
          null ||

          existente.puesto_original ===
          undefined

        ) {


          cambios.puesto_original =

            fila.estado ===
            "clasificado"

              ? fila.puesto

              : null;

        }


        if (
          !existente.estado_original
        ) {

          cambios.estado_original =
            fila.estado;

        }


        await apiPatch(

          "resultados_competencia",

          "participante_id=eq." +
          fila.participante_id,

          cambios

        );


      }

      /*
        SI ES NUEVO:
        guarda resultado vigente
        y resultado original.
      */
      else {


        await apiPost(

          "resultados_competencia",

          {


            participante_id:
              fila.participante_id,


            ...datos,


            puesto_original:

              fila.estado ===
              "clasificado"

                ? fila.puesto

                : null,


            estado_original:
              fila.estado


          }

        );

      }

    }


    await apiPatch(

      "competencias",

      "id=eq." +
      competenciaActual.id,

      {

        estado:
          "resultado_provisorio",

        archivo_origen:
          nombreArchivo,

        updated_at:
          new Date()
            .toISOString()

      }

    );


    competenciaActual.estado =
      "resultado_provisorio";


    mensaje.innerHTML = `

      <div
        class="mensaje mensaje-exito"
      >

        Resultados guardados.

        <br>

        Estado cambiado a
        resultado provisorio.

      </div>

    `;


  } catch (error) {


    console.error(
      error
    );


    mensaje.innerHTML = `

      <div
        class="mensaje mensaje-error"
      >

        ${escapar(
          error.message
        )}

      </div>

    `;

  }
}

        </h3>

          Acá podés corregir

        </p>


        <div

        >

                  Caballo
                </th>

                <th>
                  Estado
                </th>

                <th>
                  Puesto
                </th>

                <th>
                  Promedio
                </th>

                <th>
                  Premio FEU
                </th>

                <th>
                  PPM
                </th>

                  Observaciones
                </th>

                  Guardar
                </th>

              </tr>

            </thead>


            <tbody>

                p => {


                  const r =
                    mapa.get(

                        p.id
                      )

                    ) ||
                    {};


                  return `


                    <tr

                    >


                      <td>

                          ${escapar(

                          )}

                        </strong>

                      <td>


                        <select

                        >


                          <option

                            ${

                                ? "selected"

                                : ""
                            }

                          </option>

                            value="NC"

                            ${
                              r.estado_resultado ===

                            }

                              ? "checked"

            </tbody>

        <div class="acciones">

    document
      .querySelectorAll(
        "[data-guardar-resultado]"
      )
      .forEach(

        boton => {

          boton.onclick =
            () => {

              guardarResultadoManual(

                boton.dataset

              );

            };

      );


    document
      .getElementById(

      )
      .onclick =

          recalcularPosiciones(

/* ==========================================================
   GUARDAR RESULTADO MANUAL
========================================================== */

async function guardarResultadoManual(
  participanteId
) {

  const fila =
    document.querySelector(

      '[data-fila-participante="' +
      participanteId +
      '"]'

    );


  if (!fila) {

    return;

  }


  const estado =
    fila
      .querySelector(
        '[data-campo="estado"]'
      )
      .value;


  const puestoTexto =
    fila
      .querySelector(
        '[data-campo="puesto"]'
      )
      .value;


  const promedioTexto =
    fila
      .querySelector(
        '[data-campo="promedio"]'
      )
      .value;


  const premio =
    fila
      .querySelector(
        '[data-campo="premio"]'
      )
      .checked;


  const ppmTexto =
    fila
      .querySelector(
        '[data-campo="ppm"]'
      )
      .value;


  const observaciones =
    fila
      .querySelector(
        '[data-campo="observaciones"]'
      )
      .value
      .trim();


  const existentes =
    await apiGet(

      "resultados_competencia" +
      "?select=*" +
      "&participante_id=eq." +
      participanteId +
      "&limit=1"

    );


  const datos = {


    puesto:

      estado ===
      "clasificado" &&

      puestoTexto

        ? Number(
            puestoTexto
          )

        : null,


    estado_resultado:
      estado,


    promedio_kmh:

      promedioTexto

        ? Number(
            promedioTexto
          )

        : null,


    premio_feu:
      premio,


    premio_feu_ppm:

      premio &&
      ppmTexto

        ? Number(
            ppmTexto
          )

        : null,


    observaciones:
      observaciones ||
      null,


    updated_at:
      new Date()
        .toISOString()

  };


  if (
    existentes.length
  ) {


    await apiPatch(

      "resultados_competencia",

      "participante_id=eq." +
      participanteId,

      datos

    );


  } else {


    await apiPost(

      "resultados_competencia",

      {


        participante_id:
          Number(
            participanteId
          ),


        ...datos,


        puesto_original:
          datos.puesto,


        estado_original:
          datos.estado_resultado


      }

    );

  }


  document
    .getElementById(
      "mensajeEditor"
    )
    .innerHTML = `

      <div
        class="mensaje mensaje-exito"
      >

        Resultado actualizado.

      </div>

    `;
}


/* ==========================================================
   RECALCULAR PUESTOS RESPETANDO EMPATES
========================================================== */

async function recalcularPosiciones(
  competenciaId
) {

  const confirmar =
    confirm(

      "¿Querés recalcular los puestos vigentes? Se respetarán los empates oficiales. Los NC, DQ y retirados quedan sin puesto."

    );


  if (!confirmar) {

    return;

  }


  try {


    const participantes =
      await apiGet(

        "participantes_competencia" +
        "?select=id" +
        "&competencia_id=eq." +
        competenciaId

      );


    const ids =
      participantes.map(

        p =>
          p.id

      );


    if (
      !ids.length
    ) {

      return;

    }


    const resultados =
      await apiGet(

        "resultados_competencia" +
        "?select=*" +
        "&participante_id=in.(" +
        ids.join(
          ","
        ) +
        ")"

      );


    /*
      IMPORTANTE:

      Se usa puesto_original
      para mantener los empates
      oficiales FEU.

      Ejemplo:

      1
      1
      3

      sigue siendo:

      1
      1
      3

      Si uno de los primeros
      queda DQ:

      1
      DQ
      2
    */


    const clasificados =
      resultados

        .filter(

          r =>
            r.estado_resultado ===
            "clasificado"

        )

        .sort(

          (
            a,
            b
          ) => {


            const pa =

              a.puesto_original ??
              a.puesto ??
              999999;


            const pb =

              b.puesto_original ??
              b.puesto ??
              999999;


            if (
              pa !== pb
            ) {

              return (
                pa -
                pb
              );

            }


            return (

              Number(
                a.id
              ) -

              Number(
                b.id
              )

            );

          }

        );


    const grupos =
      [];


    for (
      const resultado
      of clasificados
    ) {


      const puestoBase =

        resultado.puesto_original ??
        resultado.puesto;


      let grupo =
        grupos.find(

          g =>
            Number(
              g.puestoBase
            ) ===

            Number(
              puestoBase
            )

        );


      if (!grupo) {


        grupo = {

          puestoBase,

          resultados:
            []

        };


        grupos.push(
          grupo
        );

      }


      grupo
        .resultados
        .push(
          resultado
        );

    }


    let cantidadAnteriores =
      0;


    for (
      const grupo
      of grupos
    ) {


      const puestoVigente =
        cantidadAnteriores +
        1;


      for (
        const resultado
        of grupo.resultados
      ) {


        await apiPatch(

          "resultados_competencia",

          "id=eq." +
          resultado.id,

          {

            puesto:
              puestoVigente,

            updated_at:
              new Date()
                .toISOString()

          }

        );

      }


      cantidadAnteriores +=
        grupo.resultados.length;

    }


    const noClasificados =
      resultados.filter(

        r =>
          r.estado_resultado !==
          "clasificado"

      );


    for (
      const resultado
      of noClasificados
    ) {


      await apiPatch(

        "resultados_competencia",

        "id=eq." +
        resultado.id,

        {

          puesto:
            null,

          updated_at:
            new Date()
              .toISOString()

        }

      );

    }


    await mostrarEditorResultados(
      competenciaId
    );


    document
      .getElementById(
        "mensajeEditor"
      )
      .innerHTML = `

        <div
          class="mensaje mensaje-exito"
        >

          Posiciones vigentes
          recalculadas.

          <br>

          Los empates oficiales
          fueron conservados.

        </div>

      `;


  } catch (error) {


    console.error(
      error
    );


    alert(

      "No se pudieron recalcular las posiciones."

    );

  }
}


/* ==========================================================
   ROUTER
========================================================== */

async function cargarRuta() {


  const haySesion =

    sesionAdmin &&
    sesionAdmin.access_token

      ? true

      : await renovarSesion();


  if (
    !haySesion
  ) {

    mostrarLogin();

    return;

  }


  const params =
    new URLSearchParams(

      window.location.search

    );


  const competencia =
    params.get(
      "competencia"
    );


  const vista =
    params.get(
      "vista"
    );


  const seccion =

    params.get(
      "seccion"
    ) ||

    "general";


  window.scrollTo({

    top:
      0,

    behavior:
      "instant"

  });


  if (
    vista ===
    "nueva"
  ) {

    mostrarNuevaCompetencia();

    return;

  }


  if (
    competencia
  ) {

    await mostrarCompetencia(

      competencia,
      seccion

    );

    return;

  }


  await mostrarPanel();
}


/* ==========================================================
   INICIO
========================================================== */

cargarRuta();


setInterval(

  renovarSesion,

  45 *
  60 *
  1000

);

</script>
