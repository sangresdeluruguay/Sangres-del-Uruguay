/* =========================================================
   UTILIDADES
========================================================= */

function escapar(valor){

  return String(valor ?? "")
    .replaceAll("&","&amp;")
    .replaceAll("<","&lt;")
    .replaceAll(">","&gt;")
    .replaceAll('"',"&quot;")
    .replaceAll("'","&#039;");
}


function textoLimpio(valor){

  if(
    valor === null ||
    valor === undefined
  ){
    return "";
  }

  return String(valor).trim();
}


function normalizar(texto){

  return String(texto ?? "")
    .normalize("NFD")
    .replace(/[\u0300-\u036f]/g,"")
    .toUpperCase()
    .replace(/[^A-Z0-9]/g,"");
}


function numeroSeguro(valor){

  let texto =
    textoLimpio(valor)
      .replace(/\s/g,"");

  if(!texto){
    return null;
  }

  /*
    FEU normalmente usa:
    31,78

    Si existe coma:
    - sacamos puntos de miles
    - convertimos coma decimal a punto.

    Si viene 31.78:
    dejamos ese punto decimal.
  */
  if(texto.includes(",")){

    texto =
      texto
        .replace(/\./g,"")
        .replace(",",".");

  }

  const numero =
    Number(texto);

  return Number.isNaN(numero)
    ? null
    : numero;
}


function fechaUY(fecha){

  if(!fecha){
    return "-";
  }

  const partes =
    String(fecha).split("-");

  if(partes.length !== 3){
    return escapar(fecha);
  }

  return (
    partes[2] +
    "/" +
    partes[1] +
    "/" +
    partes[0]
  );
}


function nombreEstado(estado){

  const mapa = {

    borrador:
      "Borrador",

    votacion_abierta:
      "Votación abierta",

    votacion_cerrada:
      "Votación cerrada",

    resultado_provisorio:
      "Resultado provisorio",

    resultado_definitivo:
      "Resultado definitivo"

  };

  return mapa[estado] || estado;
}


function headersAdmin(extra={}){

  return {

    apikey:
      SUPABASE_KEY,

    Authorization:
      "Bearer " +
      sesionAdmin.access_token,

    "Content-Type":
      "application/json",

    ...extra

  };
}


/* =========================================================
   SUPABASE
========================================================= */

async function apiGet(ruta){

  const respuesta =
    await fetch(

      SUPABASE_URL +
      "/rest/v1/" +
      ruta,

      {
        headers:
          headersAdmin()
      }

    );

  if(!respuesta.ok){

    throw new Error(
      await respuesta.text()
    );

  }

  return respuesta.json();
}


async function apiPost(tabla,datos){

  const respuesta =
    await fetch(

      SUPABASE_URL +
      "/rest/v1/" +
      tabla,

      {

        method:
          "POST",

        headers:
          headersAdmin({
            Prefer:
              "return=representation"
          }),

        body:
          JSON.stringify(datos)

      }

    );

  const texto =
    await respuesta.text();

  if(!respuesta.ok){

    throw new Error(texto);

  }

  return texto
    ? JSON.parse(texto)
    : [];
}


async function apiPatch(tabla,filtro,datos){

  const respuesta =
    await fetch(

      SUPABASE_URL +
      "/rest/v1/" +
      tabla +
      "?" +
      filtro,

      {

        method:
          "PATCH",

        headers:
          headersAdmin({
            Prefer:
              "return=representation"
          }),

        body:
          JSON.stringify(datos)

      }

    );

  const texto =
    await respuesta.text();

  if(!respuesta.ok){

    throw new Error(texto);

  }

  return texto
    ? JSON.parse(texto)
    : [];
}


/* =========================================================
   SESIÓN ADMIN
========================================================= */

async function iniciarSesion(email,password){

  const respuesta =
    await fetch(

      SUPABASE_URL +
      "/auth/v1/token?grant_type=password",

      {

        method:
          "POST",

        headers:{

          apikey:
            SUPABASE_KEY,

          "Content-Type":
            "application/json"

        },

        body:
          JSON.stringify({
            email,
            password
          })

      }

    );

  const datos =
    await respuesta.json();

  if(!respuesta.ok){

    throw new Error(
      "Email o contraseña incorrectos."
    );

  }

  sesionAdmin =
    datos;

  localStorage.setItem(
    "sesionAdminSdU",
    JSON.stringify(datos)
  );

}


async function renovarSesion(){

  const guardada =
    localStorage.getItem(
      "sesionAdminSdU"
    );

  if(!guardada){
    return false;
  }

  try{

    const anterior =
      JSON.parse(guardada);

    if(!anterior.refresh_token){
      return false;
    }

    const respuesta =
      await fetch(

        SUPABASE_URL +
        "/auth/v1/token?grant_type=refresh_token",

        {

          method:
            "POST",

          headers:{

            apikey:
              SUPABASE_KEY,

            "Content-Type":
              "application/json"

          },

          body:
            JSON.stringify({

              refresh_token:
                anterior.refresh_token

            })

        }

      );

    if(!respuesta.ok){
      return false;
    }

    sesionAdmin =
      await respuesta.json();

    localStorage.setItem(
      "sesionAdminSdU",
      JSON.stringify(sesionAdmin)
    );

    return true;

  }catch{

    return false;

  }
}

function buscarCampo(
  fila,
  candidatos
){

  const claves =
    Object.keys(fila);


  for(
    const candidato
    of candidatos
  ){

    const objetivo =
      normalizar(candidato);


    const clave =
      claves.find(

        k =>
          normalizar(k) ===
          objetivo

      );


    if(clave !== undefined){

      return fila[clave];

    }

  }


  return "";
}

/* =========================================================
   LECTOR EXCEL
========================================================= */

async function leerExcel(
  archivo,
  tipo
){

  const buffer =
    await archivo.arrayBuffer();


  const libro =
    XLSX.read(
      buffer,
      {
        type:
          "array"
      }
    );


  let mejor =
    null;


  for(
    const nombreHoja
    of libro.SheetNames
  ){

    const hoja =
      libro.Sheets[
        nombreHoja
      ];


    const matriz =
      XLSX.utils
        .sheet_to_json(
          hoja,
          {
            header:
              1,
            defval:
              "",
            raw:
              false
          }
        );


    if(!matriz.length){
      continue;
    }


    let filaEncabezado =
      -1;


    const limite =
      Math.min(
        matriz.length,
        40
      );


    for(
      let i=0;
      i<limite;
      i++
    ){

      const normalizados =
        matriz[i]
          .map(
            celda =>
              normalizar(celda)
          );


      const tieneEquino =
        normalizados.some(
          x =>
            x === "EQUINO" ||
            x === "CABALLO" ||
            x === "NOMBREEQUINO"
        );


      if(tieneEquino){

        filaEncabezado =
          i;

        break;

      }

    }


    if(
      filaEncabezado === -1
    ){
      continue;
    }


    const filas =
      XLSX.utils
        .sheet_to_json(
          hoja,
          {
            range:
              filaEncabezado,
            defval:
              "",
            raw:
              false
          }
        );


    const procesadas =
      filas
        .map(
          tipo === "nomina"
            ? extraerNomina
            : extraerResultado
        )
        .filter(
          fila =>
            fila.equino &&
            normalizar(
              fila.equino
            ) !==
              "EQUINO"
        );


    if(
      !mejor ||
      procesadas.length >
      mejor.filas.length
    ){

      mejor = {

        hoja:
          nombreHoja,

        filaEncabezado:
          filaEncabezado +
          1,

        filas:
          procesadas,

        matriz

      };

    }

  }


  if(
    !mejor ||
    !mejor.filas.length
  ){

    throw new Error(
      "No encontré la tabla de caballos en el Excel."
    );

  }


  return mejor;
}


/* =========================================================
   METADATOS DEL RESULTADO FEU
========================================================= */

function extraerMetadataResultado(
  matriz,
  nombreArchivo=""
){

  const lineas =
    matriz
      .slice(0,15)
      .map(
        fila =>
          fila
            .map(
              valor =>
                textoLimpio(valor)
            )
            .filter(Boolean)
            .join(" ")
      )
      .filter(Boolean);


  const texto =
    lineas.join("\n");


  let numeroRaid =
    null;

  let nombre =
    "";

  let edicion =
    "";

  let fecha =
    null;

  let distanciaKm =
    null;


  /*
    Ejemplo:

    Resultado Oficial — 03 - 38ª Edición “Patria Libre”
  */
  let coincidencia =
    texto.match(
      /Resultado\s+Oficial\s*[—–-]\s*0*(\d+)\s*-\s*([^“”"\n]*?Edici[oó]n)\s*[“"]([^”"]+)[”"]/i
    );


  if(!coincidencia){

    coincidencia =
      texto.match(
        /Resultado\s+Oficial\s*[—–-]\s*0*(\d+)\s*-\s*([^"“”\n]+?)\s*[“"]([^”"]+)[”"]/i
      );

  }


  if(coincidencia){

    numeroRaid =
      Number(
        coincidencia[1]
      );

    edicion =
      textoLimpio(
        coincidencia[2]
      );

    nombre =
      textoLimpio(
        coincidencia[3]
      );

  }


  /*
    Si por alguna razón no encuentra
    el número arriba, intenta obtenerlo
    del nombre del archivo.
  */
  if(!numeroRaid){

    const archivo =
      nombreArchivo.match(
        /raid[_\s-]*0*(\d+)/i
      );

    if(archivo){

      numeroRaid =
        Number(
          archivo[1]
        );

    }

  }


  /*
    Fecha: 15/03/2026
  */
  const fechaEncontrada =
    texto.match(
      /Fecha\s*:\s*(\d{1,2})[\/.\-](\d{1,2})[\/.\-](\d{4})/i
    );


  if(fechaEncontrada){

    const dia =
      String(
        fechaEncontrada[1]
      ).padStart(
        2,
        "0"
      );

    const mes =
      String(
        fechaEncontrada[2]
      ).padStart(
        2,
        "0"
      );

    fecha =
      fechaEncontrada[3] +
      "-" +
      mes +
      "-" +
      dia;

  }


  /*
    Distancia: 80 km
  */
  const distanciaEncontrada =
    texto.match(
      /Distancia\s*:\s*([\d.,]+)\s*km/i
    );


  if(distanciaEncontrada){

    distanciaKm =
      numeroSeguro(
        distanciaEncontrada[1]
      );

  }


  return {

    numero_raid:
      numeroRaid,

    nombre,

    edicion,

    fecha,

    distancia_km:
      distanciaKm

  };
}

/* =========================================================
   BUSCAR CABALLO
   PRIORIDAD:
   1 CHIP
   2 PASAPORTE
   3 NOMBRE DEPORTIVO
   4 ALIAS
   5 CABALLO REGISTRADO SDU
========================================================= */

function resolverCaballo(
  fila,
  base
){

  const chip =
    textoLimpio(
      fila.chip
    );

  const pasaporte =
    textoLimpio(
      fila.pasaporte
    );

  const nombre =
    normalizar(
      fila.equino
    );


  function resolverLista(
    tipo,
    lista
  ){

    const unicos =
      [];

    const usados =
      new Set();


    for(
      const elemento
      of lista
    ){

      const clave =
        String(
          elemento.id
        );


      if(
        !usados.has(
          clave
        )
      ){

        usados.add(
          clave
        );

        unicos.push(
          elemento
        );

      }

    }


    if(
      !unicos.length
    ){

      return null;

    }


    return {

      tipo,

      candidatos:
        unicos,

      ambiguo:
        unicos.length > 1

    };

  }


  if(chip){

    const resultado =
      resolverLista(

        "deportivo",

        base.deportivos
          .filter(
            caballo =>
              textoLimpio(
                caballo.chip
              ) ===
              chip
          )

      );


    if(resultado){
      return resultado;
    }

  }


  if(pasaporte){

    const resultado =
      resolverLista(

        "deportivo",

        base.deportivos
          .filter(
            caballo =>
              textoLimpio(
                caballo.pasaporte_feu
              ) ===
              pasaporte
          )

      );


    if(resultado){
      return resultado;
    }

  }


  const deportivosNombre =
    resolverLista(

      "deportivo",

      base.deportivos
        .filter(
          caballo =>
            normalizar(
              caballo.nombre_principal
            ) ===
            nombre
        )

    );


  if(deportivosNombre){
    return deportivosNombre;
  }


  const idsAlias =
    [
      ...new Set(

        base.aliases
          .filter(
            alias =>
              normalizar(
                alias.alias
              ) ===
              nombre
          )
          .map(
            alias =>
              Number(
                alias.caballo_deportivo_id
              )
          )

      )
    ];


  const porAlias =
    resolverLista(

      "deportivo",

      base.deportivos
        .filter(
          caballo =>
            idsAlias.includes(
              Number(
                caballo.id
              )
            )
        )

    );


  if(porAlias){
    return porAlias;
  }


  const registrados =
    resolverLista(

      "registrado",

      base.registrados
        .filter(
          caballo =>
            normalizar(
              caballo.Nombre
            ) ===
            nombre
        )

    );


  if(registrados){
    return registrados;
  }


  return {

    tipo:
      "nuevo",

    candidatos:
      [],

    ambiguo:
      false

  };
}


/* =========================================================
   OBTENER / CREAR CABALLO DEPORTIVO
========================================================= */

async function obtenerOCrearDeportivo(
  fila
){

  const seleccion =
    fila.seleccion ||
    "nuevo";


  /*
    Ya es deportivo.
  */
  if(
    seleccion.startsWith(
      "deportivo:"
    )
  ){

    const id =
      Number(
        seleccion.split(":")[1]
      );


    const existentes =
      await apiGet(

        "caballos_deportivos" +
        "?select=*" +
        "&id=eq." +
        id +
        "&limit=1"

      );


    const actual =
      existentes[0];


    if(actual){

      const cambios =
        {};


      if(
        !actual.chip &&
        fila.chip
      ){

        cambios.chip =
          fila.chip;

      }


      if(
        !actual.pasaporte_feu &&
        fila.pasaporte
      ){

        cambios.pasaporte_feu =
          fila.pasaporte;

      }


      if(
        !actual.propietario_actual &&
        fila.propietario
      ){

        cambios.propietario_actual =
          fila.propietario;

      }


      if(
        Object.keys(
          cambios
        ).length
      ){

        cambios.updated_at =
          new Date()
            .toISOString();


        await apiPatch(

          "caballos_deportivos",

          "id=eq." +
          id,

          cambios

        );

      }

    }


    return id;

  }


  /*
    Existe en genealogía SDU
    pero todavía no tiene ficha deportiva.
  */
  if(
    seleccion.startsWith(
      "registrado:"
    )
  ){

    const caballoId =
      Number(
        seleccion.split(":")[1]
      );


    const deportivosExistentes =
      await apiGet(

        "caballos_deportivos" +
        "?select=*" +
        "&caballo_id=eq." +
        caballoId +
        "&limit=1"

      );


    if(
      deportivosExistentes.length
    ){

      return (
        deportivosExistentes[0].id
      );

    }


    const creado =
      await apiPost(

        "caballos_deportivos",

        {

          caballo_id:
            caballoId,

          nombre_principal:
            fila.equino,

          nombre_normalizado:
            normalizar(
              fila.equino
            ),

          chip:
            fila.chip ||
            null,

          pasaporte_feu:
            fila.pasaporte ||
            null,

          propietario_actual:
            fila.propietario ||
            null

        }

      );


    return creado[0].id;

  }


  /*
    Caballo completamente nuevo.
  */
  const creado =
    await apiPost(

      "caballos_deportivos",

      {

        caballo_id:
          null,

        nombre_principal:
          fila.equino,

        nombre_normalizado:
          normalizar(
            fila.equino
          ),

        chip:
          fila.chip ||
          null,

        pasaporte_feu:
          fila.pasaporte ||
          null,

        propietario_actual:
          fila.propietario ||
          null

      }

    );


  return creado[0].id;
}

            genero:

async function buscarParticipante(
  competenciaId,
  fila
){

  const participantes =
    await apiGet(

      "participantes_competencia" +
      "?select=*" +
      "&competencia_id=eq." +
      competenciaId

    );


  return (
    participantes.find(
      participante =>

        (
          fila.chip &&
          textoLimpio(
            participante.chip
          ) ===
          textoLimpio(
            fila.chip
          )
        )

        ||

        (
          fila.pasaporte &&
          textoLimpio(
            participante.pasaporte_feu
          ) ===
          textoLimpio(
            fila.pasaporte
          )
        )

        ||

        (
          normalizar(
            participante.nombre_nomina
          ) ===
          normalizar(
            fila.equino
          )
        )
    )
    ||
    null
  );
}


async function obtenerOCrearParticipanteResultado(
  competenciaId,
  fila,
  base
){

  const existente =
    await buscarParticipante(
      competenciaId,
      fila
    );


  if(existente){

    return existente.id;

  }


  if(!fila.seleccion){

    const resultado =
      resolverCaballo(
        fila,
        base
      );


    if(resultado.ambiguo){

      throw new Error(
        "Hay más de una coincidencia para " +
        fila.equino +
        "."
      );

    }


    fila.seleccion =
      resultado.tipo ===
      "nuevo"

        ? "nuevo"

        : resultado.tipo +
          ":" +
          resultado.candidatos[0].id;

  }


  const deportivoId =
    await obtenerOCrearDeportivo(
      {

        equino:
          fila.equino,

        chip:
          fila.chip,

        pasaporte:
          fila.pasaporte,

        propietario:
          "",

        seleccion:
          fila.seleccion

      }
    );


  const creado =
    await apiPost(

      "participantes_competencia",

      {

        competencia_id:
          competenciaId,

        caballo_deportivo_id:
          deportivoId,

        numero_marcacion:
          null,

        nombre_nomina:
          fila.equino,

        nombre_normalizado:
          normalizar(
            fila.equino
          ),

        propietario_nomina:
          null,

        jinete:
          fila.jinete ||
          null,

        club:
          fila.club ||
          null,

        chip:
          fila.chip ||
          null,

        pasaporte_feu:
          fila.pasaporte ||
          null,

        genero:
          null,

        fila_origen:
          fila.fila_origen ||
          null

      }

    );


  return creado[0].id;
}

async function guardarFilaResultado(
  participanteId,
  fila
){

  const existentes =
    await apiGet(

      "resultados_competencia" +
      "?select=*" +
      "&participante_id=eq." +
      participanteId +
      "&limit=1"

    );


  const datos = {

    puesto:
      fila.estado ===
      "clasificado"

        ? fila.puesto

        : null,


    estado_resultado:
      fila.estado,


    promedio_kmh:
      fila.promedio,


    tiempo:
      fila.tiempo ||
      null,


    observaciones:
      fila.observaciones ||
      null,


    updated_at:
      new Date()
        .toISOString()

  };


  if(existentes.length){

    const existente =
      existentes[0];


    const cambios = {
      ...datos
    };


    /*
      El puesto original nunca se pisa.
      Solo lo completamos si estaba vacío.
    */
    if(
      existente.puesto_original ===
      null

      ||

      existente.puesto_original ===
      undefined
    ){

      cambios.puesto_original =
        fila.estado ===
        "clasificado"

          ? fila.puesto

          : null;

    }


    if(
      !existente.estado_original
    ){

      cambios.estado_original =
        fila.estado;

    }


    await apiPatch(

      "resultados_competencia",

      "participante_id=eq." +
      participanteId,

      cambios

    );


  }else{

    await apiPost(

      "resultados_competencia",

      {

        participante_id:
          participanteId,

        ...datos,

        puesto_original:
          fila.estado ===
          "clasificado"

            ? fila.puesto

            : null,

        estado_original:
          fila.estado

      }

    );

  }

}

            lectura.filas.map(
              (
                fila,
                indice
              ) => {

                const participante =
                  participantes.find(
                    p =>

                      (
                        fila.chip &&
                        textoLimpio(
                          p.chip
                        ) ===
                        textoLimpio(
                          fila.chip
                        )
                      )

                      ||

                      (
                        fila.pasaporte &&
                        textoLimpio(
                          p.pasaporte_feu
                        ) ===
                        textoLimpio(
                          fila.pasaporte
                        )
                      )

                      ||

                      (
                        normalizar(
                          p.nombre_nomina
                        ) ===
                        normalizar(
                          fila.equino
                        )
                      )
                  );


                if(participante){

                  return {

                    ...fila,

                    fila_origen:
                      indice +
                      1,

                    participante_id:
                      participante.id,

                    seleccion:
                      participante.caballo_deportivo_id

                        ? "deportivo:" +
                          participante.caballo_deportivo_id

                        : "",

                    candidatos:
                      []

                  };

                }


                const resultado =
                  resolverCaballo(
                    fila,
                    base
                  );


                if(
                  resultado.tipo ===
                  "nuevo"
                ){

                  return {

                    ...fila,

                    fila_origen:
                      indice +
                      1,

                    participante_id:
                      null,

                    seleccion:
                      "nuevo",

                    candidatos:
                      []

                  };

                }


                const candidatos =
                  resultado.candidatos
                    .map(
                      candidato => ({

                        tipo:
                          resultado.tipo,

                        id:
                          candidato.id,

                        nombre:
                          resultado.tipo ===
                          "deportivo"

                            ? candidato.nombre_principal

                            : candidato.Nombre

                      })
                    );


                return {

                  ...fila,

                  fila_origen:
                    indice +
                    1,

                  participante_id:
                    null,

                  seleccion:
                    resultado.ambiguo

                      ? ""

                      : resultado.tipo +
                        ":" +
                        candidatos[0].id,

                  candidatos

                };

              }
            );


          renderPreviewResultados(
            archivo.name
          );


        }catch(error){

          console.error(error);

          zona.innerHTML = `

            <div
              class="mensaje mensaje-error"
            >
              ${escapar(error.message)}
            </div>

          `;

        }

      };

}

                                  : ""
                              }

                            </option>

                            ${fila.candidatos.map(

                                const valor =

                                    value="${valor}"

                                        ? "selected"
                                        : ""

                                    ${

      ></div>

      "[data-resultado]"

          () => {

              Number(

              )
            ].seleccion =
              selector.value;

          };

      }
    );


  document
    .getElementById(
      "btnGuardarResultados"

          previewResultados.filter(

              !fila.seleccion
          );


        if(sinRelacion.length){

          alert(

          );

          document.getElementById(
            "btnGuardarResultados"
          );

          document.getElementById(
            "mensajeResultados"
          );

          true;


        mensaje.innerHTML = `

          <div class="mensaje">
            Guardando resultados...

        try{

          const base =
            await cargarBaseCaballos();


          for(
            const fila
            of previewResultados
          ){

            let participanteId =
              fila.participante_id;


            if(!participanteId){

              participanteId =
                await obtenerOCrearParticipanteResultado(

                  competenciaActual.id,

                  fila,

                  base

                );

            }


            await guardarFilaResultado(
              participanteId,
              fila
            );

          }


          await apiPatch(

            "competencias",

            "id=eq." +
            competenciaActual.id,

            {

              estado:
                "resultado_provisorio",

              archivo_origen:
                nombreArchivo,

              updated_at:
                new Date()
                  .toISOString()

            }

          );


          competenciaActual.estado =
            "resultado_provisorio";


          mensaje.innerHTML = `

            <div
              class="mensaje mensaje-exito"
            >

              Resultado guardado.

              <br>

              Los puestos y empates oficiales

          console.error(error);

          mensaje.innerHTML = `

            <div
              class="mensaje mensaje-error"
            >
              ${escapar(error.message)}
            </div>

          `;

        }


        boton.disabled =
          false;

      };

}

/* =========================================================
   CREAR / ACTUALIZAR COMPETENCIA HISTÓRICA
========================================================= */

async function obtenerOCrearCompetenciaHistorica(
  metadata,
  nombreArchivo
){

  /*
    Primero usamos N.º Raid + fecha.
    Así no mezclamos el mismo número
    de diferentes años.
  */
  const coincidenciaExacta =
    await apiGet(

      "competencias" +
      "?select=*" +
      "&numero_raid=eq." +
      metadata.numero_raid +
      "&fecha=eq." +
      encodeURIComponent(
        metadata.fecha
      ) +
      "&limit=1"

    );


  let competencia =
    coincidenciaExacta[0] ||
    null;


  /*
    Puede existir un registro incompleto
    creado anteriormente.
  */
  if(!competencia){

    const mismoNumero =
      await apiGet(

        "competencias" +
        "?select=*" +
        "&numero_raid=eq." +
        metadata.numero_raid +
        "&order=id.asc"

      );


    competencia =
      mismoNumero.find(
        item =>
          !item.fecha
      )
      ||
      null;

  }


  const datos = {

    numero_raid:
      metadata.numero_raid,

    nombre:
      metadata.nombre,

    edicion:
      metadata.edicion,

    fecha:
      metadata.fecha,

    distancia_km:
      metadata.distancia_km,

    estado:
      "resultado_definitivo",

    archivo_origen:
      nombreArchivo,

    updated_at:
      new Date()
        .toISOString()

  };


  if(competencia){

    await apiPatch(

      "competencias",

      "id=eq." +
      competencia.id,

      datos

    );


    return {

      ...competencia,
      ...datos

    };

  }


  const creada =
    await apiPost(

      "competencias",

      {

        numero_raid:
          metadata.numero_raid,

        nombre:
          metadata.nombre,

        edicion:
          metadata.edicion,

        fecha:
          metadata.fecha,

        distancia_km:
          metadata.distancia_km,

        club:
          null,

        localidad:
          null,

        estado:
          "resultado_definitivo",

        archivo_origen:
          nombreArchivo

      }

    );


  return creada[0];
}

========================================================= */

async function importarHistoricosAnalizados(
  analizados
){

  const zona =
    document.getElementById(
      "progresoHistoricos"
    );


  const boton =
    document.getElementById(
      "btnImportarHistoricos"
    );


  if(boton){
    boton.disabled = true;
  }


  let correctos =
    0;


  const errores =
    [];


  for(
    let i=0;
    i<analizados.length;
    i++
  ){

    const item =
      analizados[i];


    zona.innerHTML = `

      <div class="mensaje">

        Importando
        ${i + 1}
        de
        ${analizados.length}:

        <strong>
          ${escapar(
            item.archivo.name
          )}
        </strong>

      </div>

    `;


    try{

      /*
        Recargamos la base en cada archivo.

        Así los caballos creados
        en una carrera anterior
        ya existen para la siguiente.
      */
      const base =
        await cargarBaseCaballos();


      /*
        Antes de guardar revisamos
        que no haya coincidencias ambiguas.
      */
      const ambiguos =
        [];


      for(
        const fila
        of item.lectura.filas
      ){

        const resultado =
          resolverCaballo(
            fila,
            base
          );


        if(
          resultado.ambiguo
        ){

          ambiguos.push(
            fila.equino
          );

        }

      }


      if(ambiguos.length){

        throw new Error(

          "Coincidencias ambiguas: " +

          [
            ...new Set(
              ambiguos
            )
          ].join(", ")

        );

      }


      const competencia =
        await obtenerOCrearCompetenciaHistorica(

          item.metadata,

          item.archivo.name

        );


      for(
        let j=0;
        j<item.lectura.filas.length;
        j++
      ){

        const fila = {

          ...item.lectura.filas[j],

          fila_origen:
            j +
            1,

          seleccion:
            ""

        };


        const participanteExistente =
          await buscarParticipante(

            competencia.id,

            fila

          );


        let participanteId =
          participanteExistente

            ? participanteExistente.id

            : null;


        if(!participanteId){

          const resultado =
            resolverCaballo(
              fila,
              base
            );


          fila.seleccion =
            resultado.tipo ===
            "nuevo"

              ? "nuevo"

              : resultado.tipo +
                ":" +
                resultado.candidatos[0].id;


          participanteId =
            await obtenerOCrearParticipanteResultado(

              competencia.id,

              fila,

              base

            );

        }


        await guardarFilaResultado(
          participanteId,
          fila
        );

      }


      correctos++;


    }catch(error){

      console.error(error);

      errores.push({

        archivo:
          item.archivo.name,

        error:
          error.message

      });

    }

  }


  zona.innerHTML = `

    <div
      class="mensaje ${
        errores.length

          ? "mensaje-alerta"

          : "mensaje-exito"
      }"
    >

      <strong>
        Importación terminada.
      </strong>

      <br><br>

      ${correctos}
      archivo(s) importados correctamente.

      <br>

      ${errores.length}
      archivo(s) necesitan revisión.

    </div>


    ${errores.map(
      item => `

        <div
          class="mensaje mensaje-error"
        >

          <strong>
            ${escapar(
              item.archivo
            )}
          </strong>

          <br>

          ${escapar(
            item.error
          )}

        </div>

      `
    ).join("")}

  `;


  if(boton){
    boton.disabled = false;
  }

}

                            }
                          >
                            Retirado
                          </option>

                        </select>

                      </td>

                      <td>

                        <input
                          data-campo="puesto"
                          type="number"
                          value="${
                            resultado.puesto ??
                            ""
                          }"
                        >

                      </td>

                      <td>

                        <input
                          data-campo="promedio"
                          type="number"
                          step="0.01"
                          value="${
                            resultado.promedio_kmh ??
                            ""
                          }"
                        >

                      </td>

                      <td>

                        <input
                          data-campo="premio"
                          type="checkbox"
                          ${
                            resultado.premio_feu
                              ? "checked"
                              : ""
                          }
                        >

                      </td>

                      <td>

                        <input
                          data-campo="ppm"
                          type="number"
                          value="${
                            resultado.premio_feu_ppm ??
                            ""
                          }"
                        >

                      </td>

                      <td>

                        <input
                          class="observaciones"
                          data-campo="observaciones"
                          type="text"
                          value="${escapar(
                            resultado.observaciones ||
                            ""
                          )}"
                        >

                      </td>

                      <td>

                        <button
                          class="boton boton-principal"
                          data-guardar="${participante.id}"
                        >
                          Guardar
                        </button>

                      </td>

                    </tr>

                  `;

                }
              ).join("")}

            </tbody>

          </table>

        </div>


        <div class="acciones">

          <button
            id="btnRecalcular"
            class="boton boton-dorado"
          >
            Recalcular posiciones vigentes
          </button>

        </div>


        <div
          id="mensajeEditor"
        ></div>

      </div>

    `;


    document
      .querySelectorAll(
        "[data-guardar]"
      )
      .forEach(
        boton => {

          boton.onclick =
            () => {

              guardarResultadoManual(
                boton.dataset.guardar
              );

            };

        }
      );


    document
      .getElementById(
        "btnRecalcular"
      )
      .onclick =
        () => {

          recalcularPosiciones(id);

        };


  }catch(error){

    console.error(error);

    contenedor.innerHTML = `

      <div
        class="mensaje mensaje-error"
      >
        No se pudieron cargar los resultados.
      </div>

    `;

  }

}


/* =========================================================
   GUARDAR RESULTADO MANUAL
========================================================= */

async function guardarResultadoManual(
  participanteId
){

  const fila =
    document.querySelector(

      '[data-participante="' +
      participanteId +
      '"]'

    );


  if(!fila){
    return;
  }


  const estado =
    fila
      .querySelector(
        '[data-campo="estado"]'
      )
      .value;


  const puestoTexto =
    fila
      .querySelector(
        '[data-campo="puesto"]'
      )
      .value;


  const promedioTexto =
    fila
      .querySelector(
        '[data-campo="promedio"]'
      )
      .value;


  const premio =
    fila
      .querySelector(
        '[data-campo="premio"]'
      )
      .checked;


  const ppmTexto =
    fila
      .querySelector(
        '[data-campo="ppm"]'
      )
      .value;


  const observaciones =
    fila
      .querySelector(
        '[data-campo="observaciones"]'
      )
      .value
      .trim();


  const existentes =
    await apiGet(

      "resultados_competencia" +
      "?select=*" +
      "&participante_id=eq." +
      participanteId +
      "&limit=1"

    );


  const datos = {

    puesto:
      estado ===
      "clasificado" &&
      puestoTexto

        ? Number(
            puestoTexto
          )

        : null,


    estado_resultado:
      estado,


    promedio_kmh:
      promedioTexto

        ? Number(
            promedioTexto
          )

        : null,


    premio_feu:
      premio,


    premio_feu_ppm:
      premio &&
      ppmTexto

        ? Number(
            ppmTexto
          )

        : null,


    observaciones:
      observaciones ||
      null,


    updated_at:
      new Date()
        .toISOString()

  };


  if(existentes.length){

    await apiPatch(

      "resultados_competencia",

      "participante_id=eq." +
      participanteId,

      datos

    );


  }else{

    await apiPost(

      "resultados_competencia",

      {

        participante_id:
          Number(
            participanteId
          ),

        ...datos,

        puesto_original:
          datos.puesto,

        estado_original:
          datos.estado_resultado

      }

    );

  }


  document
    .getElementById(
      "mensajeEditor"
    )
    .innerHTML = `

      <div
        class="mensaje mensaje-exito"
      >
        Resultado actualizado.
      </div>

    `;

}


/* =========================================================
   RECALCULAR PUESTOS RESPETANDO EMPATES
========================================================= */

async function recalcularPosiciones(
  competenciaId
){

  const confirmar =
    confirm(

      "¿Querés recalcular los puestos vigentes? Se respetarán los empates oficiales. Los NC, DQ y retirados quedan sin puesto."

    );


  if(!confirmar){
    return;
  }


  try{

    const participantes =
      await apiGet(

        "participantes_competencia" +
        "?select=id" +
        "&competencia_id=eq." +
        competenciaId

      );


    const ids =
      participantes.map(
        participante =>
          participante.id
      );


    if(!ids.length){
      return;
    }


    const resultados =
      await apiGet(

        "resultados_competencia" +
        "?select=*" +
        "&participante_id=in.(" +
        ids.join(",") +
        ")"

      );


    const clasificados =
      resultados

        .filter(
          resultado =>
            resultado.estado_resultado ===
            "clasificado"
        )

        .sort(
          (
            a,
            b
          ) => {

            const puestoA =
              a.puesto_original ??
              a.puesto ??
              999999;


            const puestoB =
              b.puesto_original ??
              b.puesto ??
              999999;


            if(
              puestoA !==
              puestoB
            ){

              return (
                puestoA -
                puestoB
              );

            }


            return (
              Number(a.id) -
              Number(b.id)
            );

          }
        );


    const grupos =
      [];


    for(
      const resultado
      of clasificados
    ){

      const puestoBase =
        resultado.puesto_original ??
        resultado.puesto;


      let grupo =
        grupos.find(
          item =>
            Number(
              item.puestoBase
            ) ===
            Number(
              puestoBase
            )
        );


      if(!grupo){

        grupo = {

          puestoBase,

          resultados:
            []

        };


        grupos.push(
          grupo
        );

      }


      grupo.resultados.push(
        resultado
      );

    }


    let anteriores =
      0;


    for(
      const grupo
      of grupos
    ){

      const nuevoPuesto =
        anteriores +
        1;


      for(
        const resultado
        of grupo.resultados
      ){

        await apiPatch(

          "resultados_competencia",

          "id=eq." +
          resultado.id,

          {

            puesto:
              nuevoPuesto,

            updated_at:
              new Date()
                .toISOString()

          }

        );

      }


      anteriores +=
        grupo.resultados.length;

    }


    const noClasificados =
      resultados.filter(
        resultado =>
          resultado.estado_resultado !==
          "clasificado"
      );


    for(
      const resultado
      of noClasificados
    ){

      await apiPatch(

        "resultados_competencia",

        "id=eq." +
        resultado.id,

        {

          puesto:
            null,

          updated_at:
            new Date()
              .toISOString()

        }

      );

    }


    await mostrarEditorResultados(
      competenciaId
    );


    document
      .getElementById(
        "mensajeEditor"
      )
      .innerHTML = `

        <div
          class="mensaje mensaje-exito"
        >

          Posiciones recalculadas.

          <br>

          Los empates oficiales
          fueron conservados.

        </div>

      `;


  }catch(error){

    console.error(error);

    alert(
      "No se pudieron recalcular las posiciones."
    );

  }

}


/* =========================================================
   ROUTER
========================================================= */

async function cargarRuta(){

  const haySesion =
    sesionAdmin &&
    sesionAdmin.access_token

      ? true

      : await renovarSesion();


  if(!haySesion){

    mostrarLogin();

    return;

  }


  const parametros =
    new URLSearchParams(
      window.location.search
    );


  const competencia =
    parametros.get(
      "competencia"
    );


  const vista =
    parametros.get(
      "vista"
    );


  const seccion =
    parametros.get(
      "seccion"
    )
    ||
    "general";


  window.scrollTo({
    top:0,
    behavior:"instant"
  });


  if(
    vista ===
    "nueva"
  ){

    mostrarNuevaCompetencia();

    return;

  }


  if(
    vista ===
    "historicos"
  ){

    mostrarHistoricos();

    return;

  }


  if(competencia){

    await mostrarCompetencia(
      competencia,
      seccion
    );

    return;

  }


  await mostrarPanel();

}


/* =========================================================
   INICIO
========================================================= */

cargarRuta();


setInterval(
  renovarSesion,
  45 * 60 * 1000
);

</script>
