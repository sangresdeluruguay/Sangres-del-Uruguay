
<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Deportivos del Uruguay | Ejemplares disponibles</title>
<style>
:root {
  --verde:#183d30;
  --verde-oscuro:#102a22;
  --dorado:#c6a66a;
  --fondo:#f5f5f0;
  --blanco:#fff;
  --texto:#26352d;
  --gris:#69736d;
  --borde:#e2e6df;
}
* {box-sizing:border-box}
body {margin:0;font-family:Arial,Helvetica,sans-serif;background:var(--fondo);color:var(--texto)}
button,input,select,textarea {font:inherit}
button {cursor:pointer}
a {color:inherit;text-decoration:none}
header {background:var(--verde-oscuro);color:#fff;border-bottom:3px solid var(--dorado)}
.header-inner {max-width:1200px;margin:auto;padding:23px 20px;display:flex;justify-content:space-between;align-items:center;gap:20px;flex-wrap:wrap}
.marca {font-family:Georgia,serif;font-size:26px;font-weight:bold;letter-spacing:1px}
.marca span {display:block;font:11px Arial,sans-serif;color:var(--dorado);letter-spacing:3px;margin-top:5px}
nav {display:flex;gap:12px;flex-wrap:wrap;align-items:center}
nav a {font-size:14px;padding:10px 13px}
nav a:hover {color:var(--dorado)}
.boton {display:inline-block;border:0;border-radius:7px;padding:12px 19px;font-weight:bold;text-align:center;transition:.2s}
.boton-verde {background:var(--verde);color:white}
.boton-verde:hover {background:#265744}
.boton-dorado {background:var(--dorado);color:#17291e}
.boton-dorado:hover {background:#d8b980}
.boton-borde {border:1px solid var(--verde);background:white;color:var(--verde)}
.boton:disabled {opacity:.6;cursor:not-allowed}
main {max-width:1200px;margin:auto;padding:35px 20px 70px;min-height:65vh}
h1,h2,h3 {font-family:Georgia,serif}
h1 {font-size:35px;color:var(--verde);margin:0 0 12px}
.subtitulo {color:var(--gris);margin:0 0 30px;line-height:1.6}
.filtros {background:white;border:1px solid var(--borde);border-radius:12px;padding:20px;display:flex;align-items:end;gap:15px;flex-wrap:wrap;margin-bottom:25px}
.campo-filtro {flex:1;min-width:180px}
label {display:block;font-size:13px;font-weight:bold;margin-bottom:8px}
input,select,textarea {width:100%;border:1px solid #d2d9d1;border-radius:7px;background:white;padding:12px;color:var(--texto)}
input:focus,select:focus,textarea:focus {outline:2px solid var(--dorado);border-color:var(--dorado)}
textarea {min-height:110px;resize:vertical}
.contador {font-size:14px;color:var(--gris);margin-bottom:15px}
.grilla {display:grid;grid-template-columns:repeat(3,1fr);gap:23px}
.tarjeta {background:white;border-radius:12px;border:1px solid var(--borde);overflow:hidden;transition:.2s}
.tarjeta:hover {transform:translateY(-3px);box-shadow:0 8px 22px #00000012}
.tarjeta-imagen {width:100%;height:235px;object-fit:cover;display:block;background:#e5e8e1}
.tarjeta-cuerpo {padding:20px}
.etiqueta {display:inline-block;background:#edf2e9;color:var(--verde);border-radius:20px;padding:6px 10px;font-size:12px;font-weight:bold}
.tarjeta h2 {font-size:22px;margin:15px 0 9px;color:var(--verde)}
.detalles {color:var(--gris);font-size:14px;line-height:1.9}
.precio {color:var(--verde);font-weight:bold;font-size:20px;margin:18px 0}
.tarjeta .boton {display:block}
.panel {background:white;border:1px solid var(--borde);border-radius:12px;padding:25px;margin-bottom:22px}
.panel h2 {color:var(--verde);margin-top:0}
.ficha-cabecera {display:flex;justify-content:space-between;gap:20px;align-items:center;flex-wrap:wrap;margin-bottom:20px}
.ficha-cabecera h1 {margin-bottom:8px}
.galeria {position:relative;height:450px;background:#e8ebe5;border-radius:12px;overflow:hidden;margin-bottom:12px}
.galeria img {width:100%;height:100%;object-fit:contain;cursor:zoom-in}
.flecha {position:absolute;top:50%;transform:translateY(-50%);background:#102a22dd;color:white;border:0;width:42px;height:52px;font-size:28px;border-radius:5px}
.flecha:hover {background:var(--verde)}
.flecha-izq {left:12px}
.flecha-der {right:12px}
.miniaturas {display:flex;gap:10px;flex-wrap:wrap;margin-bottom:25px}
.miniaturas button {border:2px solid transparent;background:transparent;padding:0;border-radius:6px;overflow:hidden}
.miniaturas button.activa {border-color:var(--dorado)}
.miniaturas img {width:80px;height:65px;object-fit:cover;display:block}
.datos {display:grid;grid-template-columns:repeat(3,1fr);gap:15px}
.dato {background:#f6f8f4;border-radius:8px;padding:15px}
.dato strong {display:block;color:var(--gris);font-size:12px;margin-bottom:8px}
.dato span {font-weight:bold}
.descripcion {line-height:1.9;white-space:pre-line}
.pedigree {display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
.pedigree-columna {display:flex;flex-direction:column;justify-content:space-around;gap:8px}
.pedigree-nombre {border:1px solid #dce5dc;border-radius:7px;padding:13px 9px;background:#f2f6f2;text-align:center;font-size:13px}
.pedigree-nombre.macho {background:#e8f3fa}
.pedigree-nombre.hembra {background:#f9eaf0}
.tabla-contenedor {overflow-x:auto}
table {width:100%;border-collapse:collapse;font-size:14px}
th,td {text-align:left;padding:12px;border-bottom:1px solid var(--borde)}
th {background:#f1f5ef}
.video {width:100%;aspect-ratio:16/9;border:0;border-radius:8px}
.formulario {max-width:850px;margin:auto}
.form-grilla {display:grid;grid-template-columns:repeat(2,1fr);gap:18px}
.form-grilla .ancho-completo {grid-column:1/-1}
.ayuda {font-size:12px;color:var(--gris);margin-top:7px;line-height:1.5}
.aviso {background:#fff8e8;border:1px solid #ead7a7;border-radius:8px;padding:15px;font-size:14px;line-height:1.6;margin:18px 0}
.vacio {text-align:center;padding:55px 20px;background:white;border:1px solid var(--borde);border-radius:12px;color:var(--gris)}
.oculto {display:none!important}
footer {background:var(--verde-oscuro);color:white;padding:30px 20px;text-align:center}
footer small {color:#bac9be}
#visorFoto {position:fixed;inset:0;z-index:9999;background:#000e;display:flex;align-items:center;justify-content:center;padding:20px;cursor:zoom-out}
#visorFoto img {max-width:96vw;max-height:94vh;object-fit:contain}
@media(max-width:900px) {.grilla{grid-template-columns:repeat(2,1fr)}}
@media(max-width:600px) {
  .grilla{grid-template-columns:1fr}
  .datos{grid-template-columns:repeat(2,1fr)}
  .form-grilla{grid-template-columns:1fr}
  .form-grilla .ancho-completo{grid-column:auto}
  .galeria{height:300px}
  h1{font-size:29px}
  .marca{font-size:22px}
  .header-inner{justify-content:center;text-align:center}
  nav{justify-content:center}
}
</style>
</head>
<body>

<header>
  <div class="header-inner">
    <a href="index.html" class="marca" data-navegar>
      DEPORTIVOS DEL URUGUAY
      <span>RAID · ENDURANCE · REPRODUCCIÓN</span>
    </a>
    <nav>
      <a href="index.html" data-navegar>Ejemplares</a>
      <a href="?vista=solicitar" data-navegar>Solicitar publicación</a>
      <a href="https://www.sangresdeluruguay.com.uy/">
        Sangres del Uruguay
      </a>
    </nav>
  </div>
</header>

<main id="contenido"></main>

<footer>
  <strong>DEPORTIVOS DEL URUGUAY</strong>
  <p>Una propuesta de Sangres del Uruguay</p>
  <small>Publicaciones y consultas gestionadas por SDU.</small>
</footer>

<div id="visorFoto" class="oculto">
  <img id="visorImagen" alt="Fotografía ampliada">
</div>

<script>
"use strict";

/* CONFIGURACIÓN */

const WORKER_URL =
  "https://deportivos-fotos.sangresdeluruguay.workers.dev";

const TURNSTILE_SITE_KEY =
  "0x4AAAAAAFmpHxaIeKApIMeg";

const WHATSAPP_SDU = "59891909423";

const MAX_FOTOS = 8;
const MAX_FOTO_BYTES = 15 * 1024 * 1024;
const MAX_TOTAL_BYTES = 40 * 1024 * 1024;

const contenido = document.getElementById("contenido");

const CATEGORIAS = {
  raid: "Raid",
  endurance: "Endurance",
  padrillos: "Padrillos",
  "yeguas-madres": "Yeguas madres"
};

let CABALLOS = [];
let errorCatalogo = "";
let promesaCatalogo = null;
let limpiarFormularioSolicitud = null;
let indiceFoto = 0;

const IMAGEN_SIN_FOTO = `
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500">
<rect width="800" height="500" fill="#e9eee8"/>
<circle cx="400" cy="200" r="62" fill="#d1ddd2"/>
<path d="M365 190h70v20h-70z" fill="#a1b4a4"/>
<text x="400" y="310" text-anchor="middle"
font-family="Arial" font-size="26" fill="#58705f">
Fotografía próximamente
</text>
</svg>`;

const FOTO_PLACEHOLDER =
  "data:image/svg+xml;charset=utf-8," +
  encodeURIComponent(IMAGEN_SIN_FOTO);

function escapar(valor) {
  return String(valor ?? "")
    .replaceAll("&", "&amp;")
    .replaceAll("<", "&lt;")
    .replaceAll(">", "&gt;")
    .replaceAll('"', "&quot;")
    .replaceAll("'", "&#39;");
}

function dinero(valor) {
  return "USD " + Number(valor).toLocaleString("es-UY");
}

function precioTexto(caballo) {
  return caballo.reservado || caballo.precio == null
    ? "Precio reservado"
    : dinero(caballo.precio);
}

function normalizarCaballo(p) {
  const sexoOriginal = String(p.sexo || "").toLowerCase();

  let sexo = String(p.sexo || "");

  if (sexoOriginal === "mm" || sexoOriginal.includes("entero")) {
    sexo = "Macho entero";
  } else if (
    sexoOriginal === "mc" ||
    sexoOriginal.includes("castrado")
  ) {
    sexo = "Macho castrado";
  } else if (
    sexoOriginal === "h" ||
    sexoOriginal.includes("hembra")
  ) {
    sexo = "Hembra";
  }

  return {
    id: String(p.id),
    nombre: p.nombre || "Sin nombre",
    categoria: String(p.categoria || "").toLowerCase(),
    sexo,
    raza: p.raza || "",
    nacimiento: p.nacimiento || "",
    edad: p.edad,
    altura: p.altura_cm ? p.altura_cm + " cm" : "",
    pelo: p.pelo || "",
    pais: p.pais || "",
    ubicacion: p.ubicacion || "",
    precio: p.precio_reservado
      ? null
      : (p.precio_usd == null ? null : Number(p.precio_usd)),
    reservado: p.precio_reservado === true,
    estado: "En venta",
    descripcion: p.descripcion || "",
    fotos: Array.isArray(p.fotos)
      ? p.fotos.filter(u =>
          typeof u === "string" &&
          u.startsWith("https://")
        )
      : [],
    videos: Array.isArray(p.videos) ? p.videos : [],
    pedigree: p.pedigree || null,
    descendencia: Array.isArray(p.descendencia)
      ? p.descendencia
      : []
  };
}

/* CATÁLOGO PÚBLICO */

async function cargarCatalogo() {
  if (promesaCatalogo) return promesaCatalogo;

  promesaCatalogo = (async () => {
    try {
      const respuesta = await fetch(
        WORKER_URL + "/catalogo",
        { cache: "no-store" }
      );

      const datos = await respuesta.json();

      if (
        !respuesta.ok ||
        datos?.ok !== true ||
        !Array.isArray(datos.publicaciones)
      ) {
        throw new Error(
          datos?.error || "No se pudo obtener el catálogo."
        );
      }

      CABALLOS = datos.publicaciones.map(normalizarCaballo);
      errorCatalogo = "";

    } catch (error) {
      CABALLOS = [];
      errorCatalogo =
        "No pudimos cargar los ejemplares. " +
        "Intentá nuevamente en unos minutos.";
      console.error("Error del catálogo:", error);
      throw error;

    } finally {
      promesaCatalogo = null;
    }
  })();

  return promesaCatalogo;
}

function urlCatalogo(categoria = "", sexo = "") {
  const p = new URLSearchParams();
  if (categoria) p.set("categoria", categoria);
  if (sexo) p.set("sexo", sexo);
  return "index.html" + (p.toString() ? "?" + p : "");
}

function ir(url) {
  history.pushState({}, "", url);
  mostrarVista();
  window.scrollTo(0, 0);
}

function enlaceCaballo(id) {
  return "?caballo=" + encodeURIComponent(id);
}

function obtenerCaballo(id) {
  return CABALLOS.find(c => c.id === id);
}

function imagenPrincipal(c) {
  return c.fotos.length ? c.fotos[0] : FOTO_PLACEHOLDER;
}

function tarjetaCaballo(c) {
  return `
    <article class="tarjeta">
      <a href="${enlaceCaballo(c.id)}" data-navegar>
        <img class="tarjeta-imagen"
          src="${escapar(imagenPrincipal(c))}"
          alt="Fotografía de ${escapar(c.nombre)}">
      </a>
      <div class="tarjeta-cuerpo">
        <span class="etiqueta">
          ${escapar(CATEGORIAS[c.categoria] || c.categoria)}
        </span>
        <h2>${escapar(c.nombre)}</h2>
        <div class="detalles">
          ${escapar(c.pais)}<br>
          ${escapar(c.raza)}<br>
          ${escapar(c.sexo)}
        </div>
        <div class="precio">${escapar(precioTexto(c))}</div>
        <a class="boton boton-verde"
          href="${enlaceCaballo(c.id)}" data-navegar>
          Ver ejemplar
        </a>
      </div>
    </article>
  `;
}

function mostrarCatalogo() {
  const params = new URLSearchParams(location.search);
  const categoria = params.get("categoria") || "";
  const sexo = params.get("sexo") || "";

  const filtrados = CABALLOS.filter(c =>
    (!categoria || c.categoria === categoria) &&
    (!sexo || c.sexo === sexo)
  );

  contenido.innerHTML = `
    <h1>Ejemplares disponibles</h1>
    <p class="subtitulo">
      Caballos de raid, endurance y reproducción
      disponibles para su comercialización.
    </p>

    <section class="filtros">
      <div class="campo-filtro">
        <label for="filtroCategoria">Categoría</label>
        <select id="filtroCategoria">
          <option value="">Todas las categorías</option>
          ${Object.entries(CATEGORIAS).map(([clave, nombre]) => `
            <option value="${clave}"
              ${categoria === clave ? "selected" : ""}>
              ${nombre}
            </option>
          `).join("")}
        </select>
      </div>

      <div class="campo-filtro">
        <label for="filtroSexo">Sexo</label>
        <select id="filtroSexo">
          <option value="">Todos</option>
          ${["Macho entero", "Macho castrado", "Hembra"]
            .map(s => `
              <option value="${s}"
                ${sexo === s ? "selected" : ""}>
                ${s}
              </option>
            `).join("")}
        </select>
      </div>

      <button class="boton boton-borde" id="limpiarFiltros">
        Limpiar filtros
      </button>
    </section>

    <div class="contador">
      ${filtrados.length}
      ejemplar${filtrados.length === 1 ? "" : "es"}
      disponible${filtrados.length === 1 ? "" : "s"}
    </div>

    ${
      errorCatalogo
      ? `<div class="vacio">
          ${escapar(errorCatalogo)}
          <p><button class="boton boton-verde"
             id="reintentarCatalogo">Reintentar</button></p>
         </div>`
      : filtrados.length
      ? `<section class="grilla">
           ${filtrados.map(tarjetaCaballo).join("")}
         </section>`
      : `<div class="vacio">
           No hay ejemplares disponibles
           con los filtros seleccionados.
         </div>`
    }

    <section class="panel"
      style="margin-top:35px;text-align:center">
      <h2>¿Querés publicar tu caballo?</h2>
      <p class="subtitulo">
        Enviá los datos de tu ejemplar para que
        nuestro equipo evalúe su publicación.
      </p>
      <a class="boton boton-dorado"
        href="?vista=solicitar" data-navegar>
        Solicitar publicación
      </a>
    </section>
  `;

  document.getElementById("filtroCategoria")
    .addEventListener("change", actualizarFiltros);

  document.getElementById("filtroSexo")
    .addEventListener("change", actualizarFiltros);

  document.getElementById("limpiarFiltros")
    .addEventListener("click", () => ir("index.html"));

  document.getElementById("reintentarCatalogo")
    ?.addEventListener("click", mostrarVista);
}

function actualizarFiltros() {
  const categoria =
    document.getElementById("filtroCategoria").value;

  const sexo =
    document.getElementById("filtroSexo").value;

  history.replaceState(
    {},
    "",
    urlCatalogo(categoria, sexo)
  );

  mostrarCatalogo();
}

/* FICHA INDIVIDUAL */

function dato(titulo, valor) {
  if (
    valor === null ||
    valor === undefined ||
    valor === ""
  ) return "";

  return `
    <div class="dato">
      <strong>${escapar(titulo)}</strong>
      <span>${escapar(valor)}</span>
    </div>
  `;
}

function cambiarFoto(nuevoIndice, fotos) {
  indiceFoto = (nuevoIndice + fotos.length) % fotos.length;

  document.getElementById("fotoGrande").src =
    fotos[indiceFoto];

  document.querySelectorAll("[data-foto]").forEach(boton => {
    boton.classList.toggle(
      "activa",
      Number(boton.dataset.foto) === indiceFoto
    );
  });
}

function nombrePedigree(nombre, sexo) {
  return `
    <div class="pedigree-nombre ${sexo}">
      ${escapar(nombre || "Sin registro")}
    </div>
  `;
}

function htmlPedigree(c) {
  if (!c.pedigree) return "";

  const p = c.pedigree;

  return `
    <section class="panel">
      <h2>Pedigree</h2>
      <div class="pedigree">
        <div class="pedigree-columna">
          ${nombrePedigree(p.padre, "macho")}
          ${nombrePedigree(p.madre, "hembra")}
        </div>
        <div class="pedigree-columna">
          ${nombrePedigree(p.abueloPaterno, "macho")}
          ${nombrePedigree(p.abuelaPaterna, "hembra")}
          ${nombrePedigree(p.abueloMaterno, "macho")}
          ${nombrePedigree(p.abuelaMaterna, "hembra")}
        </div>
        <div class="pedigree-columna">
          ${(p.bisabuelos || []).map((nombre, i) =>
            nombrePedigree(
              nombre,
              i % 2 === 0 ? "macho" : "hembra"
            )
          ).join("")}
        </div>
      </div>
    </section>
  `;
}

function htmlDescendencia(c) {
  if (!c.descendencia.length) return "";

  const hijos = [...c.descendencia].sort(
    (a, b) =>
      Number(a.nacimiento || 0) -
      Number(b.nacimiento || 0)
  );

  return `
    <section class="panel">
      <h2>Descendencia registrada</h2>
      <div class="tabla-contenedor">
        <table>
          <thead>
            <tr>
              <th>Nombre</th>
              <th>Nacimiento</th>
              <th>Sexo</th>
              <th>Padre</th>
              <th>Madre</th>
            </tr>
          </thead>
          <tbody>
            ${hijos.map(h => `
              <tr>
                <td>${escapar(h.nombre)}</td>
                <td>${escapar(h.nacimiento)}</td>
                <td>${escapar(h.sexo)}</td>
                <td>${escapar(h.padre)}</td>
                <td>${escapar(h.madre)}</td>
              </tr>
            `).join("")}
          </tbody>
        </table>
      </div>
    </section>
  `;
}

function idYoutube(url) {
  try {
    const u = new URL(url);

    if (u.hostname === "youtu.be") {
      return u.pathname.slice(1).split("/")[0];
    }

    if (
      ["youtube.com", "www.youtube.com", "m.youtube.com"]
        .includes(u.hostname)
    ) {
      if (u.pathname === "/watch") {
        return u.searchParams.get("v");
      }
      if (u.pathname.startsWith("/shorts/")) {
        return u.pathname.split("/")[2];
      }
      if (u.pathname.startsWith("/embed/")) {
        return u.pathname.split("/")[2];
      }
    }
  } catch {}

  return null;
}

function htmlVideos(c) {
  const videos = c.videos
    .map(idYoutube)
    .filter(id => /^[a-zA-Z0-9_-]{11}$/.test(id));

  if (!videos.length) return "";

  return `
    <section class="panel">
      <h2>Videos del ejemplar</h2>
      ${videos.map(id => `
        <iframe class="video"
          src="https://www.youtube-nocookie.com/embed/${id}"
          title="Video del caballo"
          loading="lazy"
          allowfullscreen>
        </iframe>
      `).join("")}
    </section>
  `;
}

function mostrarFicha(c) {
  indiceFoto = 0;

  const fotos = c.fotos.length
    ? c.fotos
    : [FOTO_PLACEHOLDER];

  contenido.innerHTML = `
    <div class="ficha-cabecera">
      <div>
        <h1>${escapar(c.nombre)}</h1>
        <p class="subtitulo" style="margin:0">
          ${escapar(c.ubicacion)} · ${escapar(c.raza)}
        </p>
      </div>
      <span class="etiqueta">${escapar(c.estado)}</span>
    </div>

    <section>
      <div class="galeria">
        <img id="fotoGrande"
          src="${escapar(fotos[0])}"
          alt="Fotografía de ${escapar(c.nombre)}">

        ${fotos.length > 1 ? `
          <button class="flecha flecha-izq"
            id="fotoAnterior" aria-label="Fotografía anterior">
            &#8249;
          </button>

/* VALIDACIÓN Y ENVÍO DE SOLICITUDES */

function validarFotografias(fotos) {
  if (fotos.length < 1 || fotos.length > MAX_FOTOS) {
    throw new Error(
      "Seleccioná entre 1 y 8 fotografías."
    );
  }

  let total = 0;

  for (const foto of fotos) {
    if (
      !["image/jpeg", "image/png", "image/webp"]
        .includes(foto.type)
    ) {
      throw new Error(
        "Solo se permiten fotografías JPG, PNG o WEBP."
      );
    }

    if (!foto.size || foto.size > MAX_FOTO_BYTES) {
      throw new Error(
        "Cada fotografía debe pesar entre 1 byte y 15 MB."
      );
    }

    total += foto.size;
  }

  if (total > MAX_TOTAL_BYTES) {
    throw new Error(
      "Las fotografías no pueden superar los 40 MB en total."
    );
  }
}

async function guardarSolicitudDeportivo(datos, fotos, token) {
  validarFotografias(fotos);

  if (!token) {
    throw new Error(
      "Completá la verificación de seguridad."
    );
  }

  const cuerpo = new FormData();

  cuerpo.append("publicacion", JSON.stringify(datos));
  cuerpo.append("turnstileToken", token);

  fotos.forEach(foto =>
    cuerpo.append("fotos", foto, foto.name)
  );

  let respuesta;
  let resultado;

  try {
    respuesta = await fetch(
      WORKER_URL + "/solicitar",
      {
        method: "POST",
        body: cuerpo
      }
    );

    resultado = await respuesta.json();

  } catch {
    throw new Error(
      "No pudimos confirmar la recepción. " +
      "Conservamos el formulario. Consultá con SDU " +
      "antes de reenviarlo para evitar duplicados."
    );
  }

  if (!respuesta.ok) {
    throw new Error(
      resultado?.error ||
      "No se pudo completar la solicitud."
    );
  }

  if (
    resultado?.ok !== true ||
    !resultado.publicacion_id ||
    resultado.estado !== "pendiente" ||
    resultado.fotos_recibidas !== fotos.length
  ) {
    throw new Error(
      "No se pudo confirmar el envío completo. " +
      "Consultá con SDU antes de reenviar."
    );
  }

  return resultado;
}

/* CLOUDFLARE TURNSTILE */

let cargaTurnstile = null;

function cargarTurnstile() {
  if (window.turnstile?.render) {
    return Promise.resolve();
  }

  if (cargaTurnstile) return cargaTurnstile;

  cargaTurnstile = new Promise((resolve, reject) => {
    const script = document.createElement("script");

    const temporizador = setTimeout(
      fallo,
      20000
    );

    function fallo() {
      clearTimeout(temporizador);
      script.remove();
      cargaTurnstile = null;
      reject(new Error(
        "No se pudo cargar la verificación de seguridad."
      ));
    }

    window.alCargarTurnstileSDU = () => {
      clearTimeout(temporizador);
      resolve();
    };

    script.src =
      "https://challenges.cloudflare.com/turnstile/v0/api.js" +
      "?render=explicit&onload=alCargarTurnstileSDU";

    script.async = true;
    script.onerror = fallo;

    document.head.appendChild(script);
  });

  return cargaTurnstile;
}

        "Número de solicitud: " +

        behavior: "smooth",

      enviando = false;

      controles.forEach(({ campo, disabled }) => {
        campo.disabled = disabled;
      });

      boton.textContent =
        "Enviar solicitud de publicación";

      if (activo) {

  document.getElementById("formConsultar")
    .addEventListener("submit", e => {
      e.preventDefault();

      const formulario = e.currentTarget;

      if (!formulario.reportValidity()) return;

      const datos = new FormData(formulario);

      const accion =
        datos.get("accion") === "oferta"
          ? "OFERTA"
          : "CONSULTA";

      const monto = Number(datos.get("oferta"));

      if (
        accion === "OFERTA" &&
        (!Number.isSafeInteger(monto) || monto < 1)
      ) {
        alert("Ingresá una oferta válida en USD.");
        return;
      }

      const lineas = [
        accion + " — DEPORTIVOS DEL URUGUAY",
        "Caballo: " + c.nombre,
        "Ficha: " +
          new URL(enlaceCaballo(c.id), location.href).href,
        "Nombre: " + datos.get("nombre"),
        "Email: " + datos.get("email"),
        "Teléfono: " + datos.get("telefono"),
        "Comprador: " + datos.get("tipoComprador"),
        ...(datos.get("tipoComprador") === "internacional"
          ? [
              "País: " + (datos.get("pais") || ""),
              "Establo: " + (datos.get("establo") || "")
            ]
          : []),
        ...(accion === "OFERTA"
          ? ["Oferta: USD " + monto]
          : []),
        "Mensaje: " +
          (datos.get("mensaje") || "Sin mensaje adicional")
      ];

      const url =
        "https://wa.me/" + WHATSAPP_SDU +
        "?text=" + encodeURIComponent(lineas.join("\n"));

      window.location.href = url;
    });
}

/* NAVEGACIÓN Y RUTAS */

async function mostrarVista() {
  const rutaInicial = location.href;

  if (limpiarFormularioSolicitud) {
    limpiarFormularioSolicitud();
    limpiarFormularioSolicitud = null;
  }

  const params = new URLSearchParams(location.search);

  const vista = params.get("vista");
  const id = params.get("caballo");

  document.title =
    "Deportivos del Uruguay | Sangres del Uruguay";

  if (vista === "solicitar") {
    mostrarSolicitar();
    return;
  }

  contenido.innerHTML =
    '<div class="vacio">Cargando ejemplares...</div>';

  try {
    await cargarCatalogo();
  } catch {
    // El error se muestra en el catálogo.
  }

  if (location.href !== rutaInicial) return;

  if (vista === "consultar") {
    const caballo = obtenerCaballo(id);

    if (caballo) {
      mostrarConsultar(caballo);
    } else {
      mostrarNoEncontrado();
    }
    return;
  }

  if (id) {
    const caballo = obtenerCaballo(id);

    if (caballo) {
      document.title =
        caballo.nombre + " | Deportivos del Uruguay";
      mostrarFicha(caballo);
    } else {
      mostrarNoEncontrado();
    }
    return;
  }

  mostrarCatalogo();
}

function mostrarNoEncontrado() {
  contenido.innerHTML = `
    <div class="vacio">
      <h2>Ejemplar no encontrado</h2>
      <p>
        El ejemplar solicitado no está disponible
        en este catálogo.
      </p>
      <a href="index.html"
        class="boton boton-verde" data-navegar>
        Ver ejemplares
      </a>
    </div>
  `;
}

document.addEventListener("click", e => {
  const enlace = e.target.closest("a[data-navegar]");

  if (!enlace) return;

  if (
    e.ctrlKey ||
    e.metaKey ||
    e.shiftKey ||
    e.altKey ||
    e.button !== 0
  ) return;

  e.preventDefault();

  ir(enlace.getAttribute("href"));
});

document.getElementById("visorFoto").onclick = () => {
  document.getElementById("visorFoto")
    .classList.add("oculto");
};

document.addEventListener("keydown", e => {
  if (e.key === "Escape") {
    document.getElementById("visorFoto")
      .classList.add("oculto");
  }
});

window.addEventListener("popstate", mostrarVista);

mostrarVista();
</script>
