
<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Deportivos del Uruguay | Ejemplares disponibles</title>

<style>
:root {
  --verde: #183d30;
  --verde-oscuro: #102a22;
  --dorado: #c6a66a;
  --fondo: #f5f5f0;
  --blanco: #ffffff;
  --texto: #26352d;
  --gris: #69736d;
  --borde: #e2e6df;
}

* { box-sizing: border-box; }

body {
  margin: 0;
  font-family: Arial, Helvetica, sans-serif;
  background: var(--fondo);
  color: var(--texto);
}

button, input, select, textarea { font: inherit; }
button { cursor: pointer; }

a {
  color: inherit;
  text-decoration: none;
}

header {
  background: var(--verde-oscuro);
  color: white;
  border-bottom: 3px solid var(--dorado);
}

.header-inner {
  max-width: 1200px;
  margin: auto;
  padding: 23px 20px;
  display: flex;
  justify-content: space-between;
  align-items: center;
  gap: 20px;
  flex-wrap: wrap;
}

.marca {
  font-family: Georgia, serif;
  font-size: 26px;
  font-weight: bold;
  letter-spacing: 1px;
}

.marca span {
  display: block;
  font-family: Arial, sans-serif;
  font-size: 11px;
  color: var(--dorado);
  letter-spacing: 3px;
  margin-top: 5px;
}

nav {
  display: flex;
  gap: 12px;
  flex-wrap: wrap;
  align-items: center;
}

nav a {
  font-size: 14px;
  padding: 10px 13px;
}

nav a:hover { color: var(--dorado); }

.boton {
  display: inline-block;
  border: none;
  border-radius: 7px;
  padding: 12px 19px;
  font-weight: bold;
  text-align: center;
  transition: 0.2s;
}

.boton-verde {
  background: var(--verde);
  color: white;
}

.boton-verde:hover { background: #265744; }

.boton-dorado {
  background: var(--dorado);
  color: #17291e;
}

.boton-dorado:hover { background: #d8b980; }

.boton-borde {
  border: 1px solid var(--verde);
  background: white;
  color: var(--verde);
}

.boton:disabled {
  opacity: 0.6;
  cursor: not-allowed;
}

main {
  max-width: 1200px;
  margin: auto;
  padding: 35px 20px 70px;
  min-height: 65vh;
}

h1, h2, h3 { font-family: Georgia, serif; }

h1 {
  font-size: 35px;
  color: var(--verde);
  margin: 0 0 12px;
}

.subtitulo {
  color: var(--gris);
  margin: 0 0 30px;
  line-height: 1.6;
}

.filtros {
  background: white;
  border: 1px solid var(--borde);
  border-radius: 12px;
  padding: 20px;
  display: flex;
  align-items: end;
  gap: 15px;
  flex-wrap: wrap;
  margin-bottom: 25px;
}

.campo-filtro {
  flex: 1;
  min-width: 180px;
}

label {
  display: block;
  font-size: 13px;
  font-weight: bold;
  margin-bottom: 8px;
}

input, select, textarea {
  width: 100%;
  border: 1px solid #d2d9d1;
  border-radius: 7px;
  background: white;
  padding: 12px;
  color: var(--texto);
}

input:focus, select:focus, textarea:focus {
  outline: 2px solid var(--dorado);
  border-color: var(--dorado);
}

textarea {
  min-height: 110px;
  resize: vertical;
}

.contador {
  font-size: 14px;
  color: var(--gris);
  margin-bottom: 15px;
}

.grilla {
  display: grid;
  grid-template-columns: repeat(3, 1fr);
  gap: 23px;
}

.tarjeta {
  background: white;
  border-radius: 12px;
  border: 1px solid var(--borde);
  overflow: hidden;
  transition: 0.2s;
}

.tarjeta:hover {
  transform: translateY(-3px);
  box-shadow: 0 8px 22px #00000012;
}

.tarjeta-imagen {
  width: 100%;
  height: 235px;
  object-fit: cover;
  display: block;
  background: #e5e8e1;
}

.tarjeta-cuerpo { padding: 20px; }

.etiqueta {
  display: inline-block;
  background: #edf2e9;
  color: var(--verde);
  border-radius: 20px;
  padding: 6px 10px;
  font-size: 12px;
  font-weight: bold;
}

.tarjeta h2 {
  font-size: 22px;
  margin: 15px 0 9px;
  color: var(--verde);
}

.detalles {
  color: var(--gris);
  font-size: 14px;
  line-height: 1.9;
}

.precio {
  color: var(--verde);
  font-weight: bold;
  font-size: 20px;
  margin: 18px 0;
}

.tarjeta .boton { display: block; }

.panel {
  background: white;
  border: 1px solid var(--borde);
  border-radius: 12px;
  padding: 25px;
  margin-bottom: 22px;
}

.panel h2 {
  color: var(--verde);
  margin-top: 0;
}

.ficha-cabecera {
  display: flex;
  justify-content: space-between;
  gap: 20px;
  align-items: center;
  flex-wrap: wrap;
  margin-bottom: 20px;
}

.ficha-cabecera h1 { margin-bottom: 8px; }

.galeria {
  position: relative;
  height: 450px;
  background: #e8ebe5;
  border-radius: 12px;
  overflow: hidden;
  margin-bottom: 12px;
}

.galeria img {
  width: 100%;
  height: 100%;
  object-fit: contain;
}

.flecha {
  position: absolute;
  top: 50%;
  transform: translateY(-50%);
  background: #102a22dd;
  color: white;
  border: none;
  width: 42px;
  height: 52px;
  font-size: 28px;
  border-radius: 5px;
}

.flecha:hover { background: var(--verde); }
.flecha-izq { left: 12px; }
.flecha-der { right: 12px; }

.miniaturas {
  display: flex;
  gap: 10px;
  flex-wrap: wrap;
  margin-bottom: 25px;
}

.miniaturas button {
  border: 2px solid transparent;
  background: transparent;
  padding: 0;
  border-radius: 6px;
  overflow: hidden;
}

.miniaturas button.activa {
  border-color: var(--dorado);
}

.miniaturas img {
  width: 80px;
  height: 65px;
  object-fit: cover;
  display: block;
}

.datos {
  display: grid;
  grid-template-columns: repeat(3, 1fr);
  gap: 15px;
}

.dato {
  background: #f6f8f4;
  border-radius: 8px;
  padding: 15px;
}

.dato strong {
  display: block;
  color: var(--gris);
  font-size: 12px;
  margin-bottom: 8px;
}

.dato span { font-weight: bold; }

.descripcion {
  line-height: 1.9;
  white-space: pre-line;
}

.pedigree {
  display: grid;
  grid-template-columns: repeat(3, 1fr);
  gap: 10px;
}

.pedigree-columna {
  display: flex;
  flex-direction: column;
  justify-content: space-around;
  gap: 8px;
}

.pedigree-nombre {
  border: 1px solid #dce5dc;
  border-radius: 7px;
  padding: 13px 9px;
  background: #f2f6f2;
  text-align: center;
  font-size: 13px;
}

.pedigree-nombre.macho { background: #e8f3fa; }
.pedigree-nombre.hembra { background: #f9eaf0; }

.tabla-contenedor { overflow-x: auto; }

table {
  width: 100%;
  border-collapse: collapse;
  font-size: 14px;
}

th, td {
  text-align: left;
  padding: 12px;
  border-bottom: 1px solid var(--borde);
}

th { background: #f1f5ef; }

.video {
  width: 100%;
  aspect-ratio: 16 / 9;
  border: 0;
  border-radius: 8px;
}

.formulario {
  max-width: 850px;
  margin: auto;
}

.form-grilla {
  display: grid;
  grid-template-columns: repeat(2, 1fr);
  gap: 18px;
}

.form-grilla .ancho-completo {
  grid-column: 1 / -1;
}

.ayuda {
  font-size: 12px;
  color: var(--gris);
  margin-top: 7px;
  line-height: 1.5;
}

.aviso {
  background: #fff8e8;
  border: 1px solid #ead7a7;
  border-radius: 8px;
  padding: 15px;
  font-size: 14px;
  line-height: 1.6;
  margin: 18px 0;
}

.vacio {
  text-align: center;
  padding: 55px 20px;
  background: white;
  border: 1px solid var(--borde);
  border-radius: 12px;
  color: var(--gris);
}

.oculto { display: none !important; }

footer {
  background: var(--verde-oscuro);
  color: white;
  padding: 30px 20px;
  text-align: center;
}

footer small { color: #bac9be; }

@media(max-width: 900px) {
  .grilla { grid-template-columns: repeat(2, 1fr); }
}

@media(max-width: 600px) {
  .grilla { grid-template-columns: 1fr; }
  .datos { grid-template-columns: repeat(2, 1fr); }
  .form-grilla { grid-template-columns: 1fr; }
  .form-grilla .ancho-completo { grid-column: auto; }
  .galeria { height: 300px; }
  h1 { font-size: 29px; }
  .marca { font-size: 22px; }
  .header-inner {
    justify-content: center;
    text-align: center;
  }
  nav { justify-content: center; }
}
</style>
</head>

  <div class="header-inner">
    <a href="index.html" class="marca">

      <span>RAID · ENDURANCE · REPRODUCCIÓN</span>
    </a>

    <nav>

      <a href="?vista=solicitar">Solicitar publicación</a>
      <a href="https://www.sangresdeluruguay.com.uy/">
        Sangres del Uruguay
      </a>
    </nav>
  </div>
</header>

<main id="contenido"></main>

<footer>
  <strong>DEPORTIVOS DEL URUGUAY</strong>
  <p>Una propuesta de Sangres del Uruguay</p>
