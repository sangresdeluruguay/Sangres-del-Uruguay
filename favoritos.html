<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1, viewport-fit=cover"
  >

  <title>Favoritos | Sangres del Uruguay</title>

  <style>
    :root {
      --azul: #173b72;
      --azul2: #245592;
      --dorado: #b89a56;
      --fondo: #f4f5f7;
      --blanco: #ffffff;
      --texto: #20242a;
      --gris: #6b7280;
      --borde: #d9dde5;
      --verde: #21834f;
      --verde-fondo: #e8f5ed;
      --amarillo: #946c13;
      --amarillo-fondo: #fff5d8;
      --rojo: #a43c3c;
      --rojo-fondo: #f9e8e8;
    }

    * {
      box-sizing: border-box;
    }

    html,
    body {
      margin: 0;
      padding: 0;
    }

    body {
      min-height: 100vh;
      background: var(--fondo);
      color: var(--texto);
      font-family: Arial, Helvetica, sans-serif;
    }

    a {
      color: inherit;
    }

    button {
      font: inherit;
      cursor: pointer;
    }

    .encabezado {
      width: 100%;
      background: var(--azul);
      color: white;
      margin: 0;
      padding:
        max(22px, env(safe-area-inset-top))
        16px
        20px;
    }

    .encabezado-contenido {
      width: min(100%, 1080px);
      margin: 0 auto;
      text-align: center;
    }

    .logo-favoritos {
      display: block;
      max-width: 180px;
      max-height: 90px;
      margin: 0 auto 8px;
      object-fit: contain;
    }

    .encabezado h1 {
      margin: 0;
      font-size: clamp(34px, 6vw, 52px);
    }

    .encabezado p {
      margin: 6px 0 0;
      color: #e4d09c;
      font-weight: 700;
    }

    .menu {
      margin-top: 20px;
      display: flex;
      justify-content: center;
      flex-wrap: wrap;
      gap: 10px 24px;
    }

    .menu a {
      color: white;
      text-decoration: none;
      font-weight: 700;
      font-size: 14px;
    }

    main {
      width: min(100%, 1080px);
      margin: 0 auto;
      padding: 24px 14px 55px;
    }

    h2,
    h3 {
      color: var(--azul);
    }

    h2 {
      margin-top: 0;
    }

    .titulo-centro {
      text-align: center;
      margin-bottom: 6px;
    }

    .subtitulo {
      color: var(--gris);
      line-height: 1.45;
    }

    .subtitulo-centro {
      text-align: center;
      margin: 0 0 24px;
    }

    .tarjeta {
      background: var(--blanco);
      border: 1px solid var(--borde);
      border-radius: 14px;
      padding: 20px;
      margin-bottom: 18px;
      box-shadow: 0 3px 12px rgba(0,0,0,.04);
    }

    .mensaje {
      padding: 15px;
      border-radius: 10px;
      background: #eef2f7;
      color: var(--gris);
      margin: 12px 0;
    }

    .mensaje-exito {
      background: var(--verde-fondo);
      color: var(--verde);
    }

    .mensaje-error {
      background: var(--rojo-fondo);
      color: var(--rojo);
    }

    .lista-competencias {
      display: grid;
      grid-template-columns:
        repeat(2, minmax(0, 1fr));
      gap: 16px;
    }

    .competencia {
      display: block;
      background: white;
      border: 1px solid var(--borde);
      border-radius: 14px;
      padding: 20px;
      text-decoration: none;
      box-shadow: 0 3px 12px rgba(0,0,0,.04);
      transition:
        transform .15s ease,
        box-shadow .15s ease;
    }

    .competencia:hover {
      transform: translateY(-2px);
      box-shadow: 0 7px 18px rgba(0,0,0,.07);
    }

    .competencia h3 {
      margin: 0 0 9px;
      font-size: 20px;
    }

    .meta {
      color: var(--gris);
      font-size: 13px;
      line-height: 1.55;
    }

    .estado {
      display: inline-block;
      margin-top: 12px;
      padding: 5px 10px;
      border-radius: 999px;
      font-size: 11px;
      font-weight: 700;
    }

    .estado-verde {
      background: var(--verde-fondo);
      color: var(--verde);
    }

    .estado-amarillo {
      background: var(--amarillo-fondo);
      color: var(--amarillo);
    }

    .estado-rojo {
      background: var(--rojo-fondo);
      color: var(--rojo);
    }

    .separador-titulo {
      margin-top: 34px;
      margin-bottom: 14px;
    }

    .cabecera-raid {
      text-align: center;
    }

    .cabecera-raid h2 {
      margin-bottom: 8px;
      font-size: clamp(26px, 5vw, 38px);
    }

    .top4 {
      border: 2px solid var(--dorado);
      background: #fffdf7;
    }

    .top4 h3 {
      text-align: center;
      margin: 0 0 16px;
      font-size: 23px;
    }

    .ranking-lista {
      display: grid;
      gap: 10px;
    }

    .ranking-fila {
      display: grid;
      grid-template-columns:
        42px
        minmax(0,1fr)
        80px;
      gap: 10px;
      align-items: center;
      background: white;
      border: 1px solid #ece6d8;
      border-radius: 10px;
      padding: 12px 13px;
    }

    .ranking-puesto {
      text-align: center;
      color: var(--dorado);
      font-size: 20px;
      font-weight: 800;
    }

    .ranking-nombre {
      color: var(--azul);
      font-weight: 800;
      text-decoration: none;
    }

    .ranking-porcentaje {
      text-align: right;
      color: var(--azul);
      font-weight: 800;
      font-size: 18px;
    }

    .nomina {
      display: grid;
      gap: 10px;
    }

    .caballo-voto {
      display: grid;
      grid-template-columns:
        58px
        minmax(0,1fr)
        auto;
      gap: 12px;
      align-items: center;
      background: white;
      border: 1px solid var(--borde);
      border-radius: 11px;
      padding: 14px;
    }

    .numero-marcacion {
      text-align: center;
      color: var(--azul);
      font-size: 20px;
      font-weight: 800;
    }

    .caballo-info {
      min-width: 0;
    }

    .caballo-nombre {
      display: inline-block;
      color: var(--azul);
      font-weight: 800;
      text-decoration: none;
      font-size: 16px;
    }

    .caballo-nombre:hover {
      text-decoration: underline;
    }

    .caballo-detalle {
      margin-top: 4px;
      color: var(--gris);
      font-size: 12px;
      line-height: 1.4;
    }

    .boton-votar {
      border: 0;
      border-radius: 8px;
      background: var(--azul);
      color: white;
      padding: 10px 16px;
      font-weight: 700;
      min-width: 82px;
    }

    .boton-votar:hover {
      background: var(--azul2);
    }

    .boton-votar:disabled {
      opacity: .5;
      cursor: default;
    }

    .porcentaje-publico {
      min-width: 70px;
      text-align: right;
      color: var(--azul);
      font-size: 17px;
      font-weight: 800;
    }

    .barra {
      width: 100%;
      height: 7px;
      margin-top: 8px;
      border-radius: 999px;
      background: #e7eaf0;
      overflow: hidden;
    }

    .barra span {
      display: block;
      height: 100%;
      border-radius: 999px;
      background: var(--dorado);
    }

    .ficha-caballo h2 {
      margin-bottom: 6px;
      font-size: clamp(28px,5vw,40px);
    }

    .datos-caballo {
      display: grid;
      grid-template-columns:
        repeat(3,minmax(0,1fr));
      gap: 10px;
      margin-top: 18px;
    }

    .dato {
      border: 1px solid var(--borde);
      border-radius: 9px;
      padding: 12px;
      background: #fafbfc;
    }

    .dato strong {
      display: block;
      color: var(--gris);
      font-size: 11px;
      margin-bottom: 5px;
    }

    .resumen-deportivo {
      display: grid;
      grid-template-columns:
        repeat(5,minmax(0,1fr));
      gap: 9px;
      margin: 18px 0;
    }

    .resumen-item {
      text-align: center;
      padding: 13px 8px;
      border: 1px solid var(--borde);
      border-radius: 9px;
      background: white;
    }

    .resumen-item strong {
      display: block;
      color: var(--azul);
      font-size: 22px;
    }

    .resumen-item small {
      color: var(--gris);
    }

    .tabla-contenedor {
      width: 100%;
      overflow-x: auto;
      border: 1px solid var(--borde);
      border-radius: 11px;
      background: white;
    }

    table {
      width: 100%;
      border-collapse: collapse;
      min-width: 850px;
    }

    th,
    td {
      padding: 10px 9px;
      border-bottom: 1px solid #e7e9ed;
      text-align: left;
      font-size: 12px;
      vertical-align: middle;
    }

    th {
      background: #f1f3f6;
      color: var(--azul);
      white-space: nowrap;
    }

    tr:last-child td {
      border-bottom: 0;
    }

    .premio-feu {
      font-weight: 800;
      white-space: nowrap;
    }

    footer {
      text-align: center;
      color: var(--gris);
      font-size: 12px;
      padding: 0 16px 30px;
    }

    @media (max-width: 760px) {

      .lista-competencias {
        grid-template-columns: 1fr;
      }

      ..caballo-voto {
  grid-template-columns:
    44px
    minmax(0,1fr)
    auto;
}

.accion-voto,
.porcentaje-publico {
  grid-column: 3;
  justify-self: end;
  text-align: right;
}

      .datos-caballo {
        grid-template-columns: 1fr;
      }

      .resumen-deportivo {
        grid-template-columns:
          repeat(2,minmax(0,1fr));
      }

      .ranking-fila {
        grid-template-columns:
          34px
          minmax(0,1fr)
          62px;
      }
    }
  </style>
</head>

<body>

<header class="encabezado">

  <div class="encabezado-contenido">

    <img
      src="logo-favoritos.png"
      alt="Favoritos"
      class="logo-favoritos"
      onerror="this.style.display='none'"
    >

    <h1>
      Favoritos
    </h1>

    <p>
      Sangres del Uruguay
    </p>

    <nav class="menu">

      <a href="index.html">
        Sangres del Uruguay
      </a>

      <a href="favoritos.html">
        Favoritos
      </a>

    </nav>

  </div>

</header>


<main id="app">

  <div class="mensaje">
    Cargando...
  </div>

</main>


<footer>
  Favoritos · Sangres del Uruguay
</footer>


<script>

/* ==========================================================
   CONFIGURACIÓN
========================================================== */

const SUPABASE_URL =
  "https://arsjvaueyjwntefogmqz.supabase.co";

const SUPABASE_KEY =
  "sb_publishable_Q180CMeKmdMMVRa3WUBvIQ_0ceNY6zK";

const app =
  document.getElementById(
    "app"
  );


/* ==========================================================
   UTILIDADES
========================================================== */

function escapar(valor) {

  return String(
    valor ?? ""
  )
    .replaceAll(
      "&",
      "&amp;"
    )
    .replaceAll(
      "<",
      "&lt;"
    )
    .replaceAll(
      ">",
      "&gt;"
    )
    .replaceAll(
      '"',
      "&quot;"
    )
    .replaceAll(
      "'",
      "&#039;"
    );

}


function fechaUY(fecha) {

  if (!fecha) {
    return "-";
  }


  const partes =
    String(fecha)
      .split("-");


  if (
    partes.length !==
    3
  ) {
    return escapar(
      fecha
    );
  }


  return (
    partes[2] +
    "/" +
    partes[1] +
    "/" +
    partes[0]
  );

}


function nombreEstado(
  estado
) {

  const mapa = {

    borrador:
      "Borrador",

    votacion_abierta:
      "Votación abierta",

    votacion_cerrada:
      "Votación cerrada",

    resultado_provisorio:
      "Resultado provisorio",

    resultado_definitivo:
      "Resultado definitivo"

  };


  return (
    mapa[estado] ||
    estado
  );

}


function claseEstado(
  estado
) {

  if (
    estado ===
      "votacion_abierta" ||
    estado ===
      "resultado_definitivo"
  ) {
    return "estado-verde";
  }


  if (
    estado ===
    "votacion_cerrada"
  ) {
    return "estado-rojo";
  }


  return "estado-amarillo";

}


function numeroOrden(
  valor
) {

  const numero =
    Number(
      String(
        valor ?? ""
      )
        .replace(
          /[^0-9.-]/g,
          ""
        )
    );


  return Number.isFinite(
    numero
  )
    ? numero
    : 999999;

}


function porcentaje(
  cantidad,
  total
) {

  if (!total) {
    return 0;
  }


  return Math.round(
    (
      Number(
        cantidad
      ) /
      Number(
        total
      )
    ) *
    100
  );

}


function generarUUID() {

  if (
    window.crypto &&
    crypto.randomUUID
  ) {

    return crypto.randomUUID();

  }


  return (
    Date.now()
      .toString(36) +
    "-" +
    Math.random()
      .toString(36)
      .slice(2) +
    "-" +
    Math.random()
      .toString(36)
      .slice(2)
  );

}


function obtenerVoterKey() {

  let key =
    localStorage.getItem(
      "favoritosVoterKey"
    );


  if (!key) {

    key =
      generarUUID();


    localStorage.setItem(
      "favoritosVoterKey",
      key
    );

  }


  return key;

}


function votoLocal(
  competenciaId
) {

  return localStorage.getItem(
    "favoritosVotoRaid_" +
    competenciaId
  );

}


/* ==========================================================
   SUPABASE
========================================================== */

function headersPublicos(
  extra = {}
) {

  return {

    apikey:
      SUPABASE_KEY,

    Authorization:
      "Bearer " +
      SUPABASE_KEY,

    "Content-Type":
      "application/json",

    ...extra

  };

}


async function apiGet(
  ruta
) {

  const respuesta =
    await fetch(
      SUPABASE_URL +
      "/rest/v1/" +
      ruta,
      {
        headers:
          headersPublicos()
      }
    );


  if (
    !respuesta.ok
  ) {

    throw new Error(
      await respuesta.text()
    );

  }


  return respuesta.json();

}


async function apiPost(
  tabla,
  datos
) {

  const respuesta =
    await fetch(
      SUPABASE_URL +
      "/rest/v1/" +
      tabla,
      {

        method:
          "POST",

        headers:
          headersPublicos({
            Prefer:
              "return=minimal"
          }),

        body:
          JSON.stringify(
            datos
          )

      }
    );


  if (
    !respuesta.ok
  ) {

    throw new Error(
      await respuesta.text()
    );

  }


  return true;

}


/* ==========================================================
   LINKS DE CABALLO
========================================================== */

function urlCaballo(
  participante,
  deportivo
) {

  if (
    deportivo &&
    deportivo.caballo_id
  ) {

    return (
      "index.html?caballo=" +
      encodeURIComponent(
        deportivo
          .nombre_principal ||
        participante
          .nombre_nomina ||
        ""
      )
    );

  }


  return (
    "favoritos.html?caballo=" +
    encodeURIComponent(
      participante
        .caballo_deportivo_id
    )
  );

}


function enlaceCaballo(
  participante,
  deportivo,
  clase = "caballo-nombre"
) {

  return `

    <a
      href="${urlCaballo(
        participante,
        deportivo
      )}"
      class="${clase}"
    >
      ${escapar(
        participante
          .nombre_nomina ||
        deportivo
          ?.nombre_principal ||
        "-"
      )}
    </a>

  `;

}


/* ==========================================================
   PORTADA
========================================================== */

async function mostrarInicio() {

  app.innerHTML = `

    <div class="mensaje">
      Cargando competencias...
    </div>

  `;


  try {

    const competencias =
      await apiGet(
        "competencias" +
        "?select=*" +
        "&order=fecha.desc"
      );


    const abiertas =
      competencias.filter(
        competencia =>
          competencia.estado ===
          "votacion_abierta"
      );


    const anteriores =
      competencias.filter(
        competencia =>
          competencia.estado !==
            "votacion_abierta" &&
          competencia.estado !==
            "borrador"
      );


    app.innerHTML = `

      <section>

        <h2
          class="titulo-centro"
        >
          Favoritos
        </h2>


        <p
          class="
            subtitulo
            subtitulo-centro
          "
        >
          Elegí un Raid para ver
          la nómina y votar.
        </p>


        ${
          abiertas.length
            ? `

              <div
                class="lista-competencias"
              >

                ${
                  abiertas
                    .map(
                      competencia =>
                        tarjetaCompetencia(
                          competencia
                        )
                    )
                    .join("")
                }

              </div>

            `
            : `

              <div
                class="mensaje"
              >
                En este momento no hay
                votaciones abiertas.
              </div>

            `
        }


        ${
          anteriores.length
            ? `

              <h2
                class="separador-titulo"
              >
                Raids anteriores
              </h2>


              <div
                class="lista-competencias"
              >

                ${
                  anteriores
                    .map(
                      competencia =>
                        tarjetaCompetencia(
                          competencia
                        )
                    )
                    .join("")
                }

              </div>

            `
            : ""
        }

      </section>

    `;

  }

  catch (error) {

    console.error(
      error
    );


    app.innerHTML = `

      <div
        class="
          mensaje
          mensaje-error
        "
      >
        No se pudieron cargar
        las competencias.
      </div>

    `;

  }

}


function tarjetaCompetencia(
  competencia
) {

  return `

    <a
      class="competencia"
      href="favoritos.html?raid=${encodeURIComponent(
        competencia.id
      )}"
    >

      <h3>
        ${escapar(
          competencia.nombre
        )}
      </h3>


      <div
        class="meta"
      >

        ${
          competencia.edicion
            ? escapar(
                competencia.edicion
              ) +
              "<br>"
            : ""
        }

        ${fechaUY(
          competencia.fecha
        )}

        <br>

        ${
          competencia.distancia_km
            ? escapar(
                competencia.distancia_km
              ) +
              " km"
            : "-"
        }

        ${
          competencia.localidad
            ? "<br>" +
              escapar(
                competencia.localidad
              )
            : ""
        }

      </div>


      <span
        class="
          estado
          ${claseEstado(
            competencia.estado
          )}
        "
      >
        ${escapar(
          nombreEstado(
            competencia.estado
          )
        )}
      </span>

    </a>

  `;

}


/* ==========================================================
   RAID
========================================================== */

async function mostrarRaid(

) {

  app.innerHTML = `

    <div class="mensaje">

    </div>

  `;


  try {

    const competencias =

        "competencias" +
        "?select=*" +
        "&id=eq." +
        encodeURIComponent(

        ) +
        "&limit=1"
      );


    const competencia =
      competencias[0];


    if (!competencia) {

      app.innerHTML = `

        </div>

const cierreVotacion =

) {

}

        );

    }


    const mapaDeportivos =

    deportivos.forEach(
      deportivo => {

        mapaDeportivos.set(
          Number(
            deportivo.id
          ),
          deportivo
        );

      }
    );


    /*
      No pedimos voter_key.
      Solo necesitamos participante_id
      para calcular porcentajes.
    */

    const votos =
      await apiGet(
        "votos_favoritos" +
        "?select=participante_id" +
        "&competencia_id=eq." +
        encodeURIComponent(
          competenciaId
        )
      );


    const yaVoto =
      Boolean(
        votoLocal(
          competenciaId
        )
      );


    const conteos =
      new Map();


    participantes.forEach(
      participante => {

        conteos.set(
          Number(
            participante.id
          ),
          0
        );

      }
    );


    votos.forEach(
      voto => {

        const participanteId =
          Number(
            voto.participante_id
          );


        conteos.set(
          participanteId,
          (
            conteos.get(
              participanteId
            ) ||
            0
          ) +
          1
        );

      }
    );


    const totalVotos =
      votos.length;


    const mostrarPorcentajes =
      yaVoto ||
      competencia.estado !==
        "votacion_abierta";


    const ranking =
      participantes
        .map(
          participante => {

            const cantidad =
              conteos.get(
                Number(
                  participante.id
                )
              ) ||
              0;


            return {

              participante,

              votos:
                cantidad,

              porcentaje:
                porcentaje(
                  cantidad,
                  totalVotos
                )

            };

          }
        )
        .sort(
          (
            a,
            b
          ) => {

            if (
              b.votos !==
              a.votos
            ) {

              return (
                b.votos -
                a.votos
              );

            }


            const numeroA =
              numeroOrden(
                a.participante
                  .numero_marcacion
              );


            const numeroB =
              numeroOrden(
                b.participante
                  .numero_marcacion
              );


            if (
              numeroA !==
              numeroB
            ) {

              return (
                numeroA -
                numeroB
              );

            }


            return String(
              a.participante
                .nombre_nomina ||
              ""
            )
              .localeCompare(
                String(
                  b.participante
                    .nombre_nomina ||
                  ""
                ),
                "es"
              );

          }
        );


    const top4 =
      ranking.slice(
        0,
        4
      );


    app.innerHTML = `

      <section
        class="
          tarjeta
          cabecera-raid
        "
      >

        <h2>
          ${escapar(
            competencia.nombre
          )}
        </h2>


        <div
          class="meta"
        >

          ${
            competencia.edicion
              ? escapar(
                  competencia.edicion
                ) +
                "<br>"
              : ""
          }

          ${fechaUY(
            competencia.fecha
          )}

          ·

          ${
            competencia.distancia_km
              ? escapar(
                  competencia.distancia_km
                ) +
                " km"
              : "-"
          }

          ${
            competencia.localidad
              ? "<br>" +
                escapar(
                  competencia.localidad
                )
              : ""
          }

        </div>


        <span
          class="
            estado
            ${claseEstado(
              competencia.estado
            )}
          "
        >
          ${escapar(
            nombreEstado(
              competencia.estado
            )
          )}
        </span>

        ${
  competencia.estado === "votacion_abierta"
    ? `
      <div
        id="contadorCierreVotacion"
        style="
          margin-top:14px;
          font-weight:800;
          color:#173b72;
          font-size:17px;
        "
      >
        ⏳ Cierra el domingo a las 09:00
      </div>
    `
    : ""
}

      </section>


      ${
        mostrarPorcentajes &&
        participantes.length
          ? renderTop4(
              top4,
              mapaDeportivos
            )
          : ""
      }


      ${
        yaVoto
          ? `

            <div
              class="
                mensaje
                mensaje-exito
              "
            >
              Tu voto ya fue registrado
              para este Raid.
            </div>

          `
          : ""
      }


      ${
        competencia.estado ===
          "votacion_abierta" &&
        !yaVoto
          ? `

            <div
              class="mensaje"
            >
              Elegí tu favorito.
              Podés votar una sola vez
              en este Raid.
            </div>

          `
          : ""
      }


      <div
        class="tarjeta"
      >

        <h3>
          Nómina
        </h3>


        ${
          participantes.length
            ? `

              <div
                class="nomina"
              >

                ${
                  participantes
                    .map(
                      participante =>
                        renderParticipante(
                          participante,

                          mapaDeportivos.get(
                            Number(
                              participante
                                .caballo_deportivo_id
                            )
                          ),

                          competencia,

                          yaVoto,

                          mostrarPorcentajes,

                          conteos,

                          totalVotos
                        )
                    )
                    .join("")
                }

              </div>

            `
            : `

              <div class="mensaje">
                Todavía no hay
                participantes cargados.
              </div>

            `
        }

      </div>

    `;


    document
      .querySelectorAll(
        "[data-votar]"
      )
      .forEach(
        boton => {

          boton.onclick =
            () => {

              const participanteId =
                Number(
                  boton
                    .dataset
                    .votar
                );


              registrarVoto(
                competencia.id,
                participanteId
              );

            };

        }
      );

  }
const contador =
  document.getElementById(
    "contadorCierreVotacion"
  );

if (
  contador &&
  competencia.estado === "votacion_abierta"
) {

  function actualizarContador() {

    const ahoraActual =
      new Date();

    const diferencia =
      cierreVotacion -
      ahoraActual;

    if (diferencia <= 0) {
      contador.textContent =
        "Votación cerrada";

      mostrarRaid(
        competencia.id
      );

      return;
    }

    const horas =
      Math.floor(
        diferencia /
        (1000 * 60 * 60)
      );

    const minutos =
      Math.floor(
        (
          diferencia %
          (1000 * 60 * 60)
        ) /
        (1000 * 60)
      );

    const segundos =
      Math.floor(
        (
          diferencia %
          (1000 * 60)
        ) /
        1000
      );

    contador.textContent =
      "⏳ Cierra el domingo a las 09:00 · " +
      "Faltan " +
      horas +
      " h " +
      minutos +
      " min " +
      segundos +
      " s";
  }

  actualizarContador();

  setInterval(
    actualizarContador,
    1000
  );
}
  catch (error) {

    console.error(
      error
    );


    app.innerHTML = `

      <div
        class="
          mensaje
          mensaje-error
        "
      >
        No se pudo cargar el Raid.
      </div>

    `;

  }

}

   TOP 4

) {

      <h3>

/* ==========================================================
   FILA DE CABALLO
========================================================== */

function renderParticipante(
  participante,
  deportivo,
  competencia,
  yaVoto,
  mostrarPorcentajes,
  conteos,
  totalVotos
) {

  const cantidad =
    conteos.get(
      Number(
        participante.id
      )
    ) ||
    0;


  const porc =
    porcentaje(
      cantidad,
      totalVotos
    );


  const puedeVotar =
    competencia.estado ===
      "votacion_abierta" &&
    !yaVoto;


  return `

    <div
      class="caballo-voto"
    >

      <div
        class="
          numero-marcacion
        "
      >
        ${escapar(
          participante
            .numero_marcacion ||
          "-"
        )}
      </div>


      <div
        class="caballo-info"
      >

        ${enlaceCaballo(
          participante,
          deportivo
        )}


        <div
          class="caballo-detalle"
        >

          ${
            participante.jinete
              ? "Jinete: " +
                escapar(
                  participante.jinete
                )
              : ""
          }

          ${
            participante
              .propietario_nomina
              ? (
                  participante.jinete
                    ? " · "
                    : ""
                ) +
                "Propietario: " +
                escapar(
                  participante
                    .propietario_nomina
                )
              : ""
          }

        </div>


        ${
          mostrarPorcentajes
            ? `

              <div
                class="barra"
              >
                <span
                  style="
                    width:${porc}%;
                  "
                ></span>
              </div>

            `
            : ""
        }

      </div>


      ${
        puedeVotar
          ? `

            <div
              class="accion-voto"
            >

              <button
                class="boton-votar"
                data-votar="${participante.id}"
              >
                Votar
              </button>

            </div>

          `
          : (

              mostrarPorcentajes
                ? `

                  <div
                    class="
                      porcentaje-publico
                    "
                  >
                    ${porc}%
                  </div>

                `
                : ""

            )
      }

    </div>

  `;

}


/* ==========================================================
   REGISTRAR VOTO
========================================================== */

async function registrarVoto(
  competenciaId,
  participanteId
) {

  const voterKey =
    obtenerVoterKey();


  const confirmar =
    confirm(
      "¿Confirmás tu voto por este caballo?"
    );


  if (!confirmar) {
    return;
  }


  document
    .querySelectorAll(
      "[data-votar]"
    )
    .forEach(
      boton => {

        boton.disabled =
          true;

      }
    );


  try {

    await apiPost(
      "votos_favoritos",
      {

        competencia_id:
          Number(
            competenciaId
          ),

        participante_id:
          Number(
            participanteId
          ),

        voter_key:
          voterKey

      }
    );


    localStorage.setItem(
      "favoritosVotoRaid_" +
      competenciaId,

      String(
        participanteId
      )
    );


    await mostrarRaid(
      competenciaId
    );

  }

  catch (error) {

    console.error(
      error
    );


    /*
      Si Supabase informa que ya
      existe un voto de este voter_key,
      marcamos localmente este Raid
      como votado y recargamos.
    */

    localStorage.setItem(
      "favoritosVotoRaid_" +
      competenciaId,

      "registrado"
    );


    await mostrarRaid(
      competenciaId
    );

  }

}


/* ==========================================================
   FICHA DEPORTIVA
========================================================== */

async function mostrarCaballo(
  caballoDeportivoId
) {

  app.innerHTML = `

    <div class="mensaje">
      Cargando caballo...
    </div>

  `;


  try {

    const datos =
      await apiGet(
        "caballos_deportivos" +
        "?select=*" +
        "&id=eq." +
        encodeURIComponent(
          caballoDeportivoId
        ) +
        "&limit=1"
      );


    const caballo =
      datos[0];


    if (!caballo) {

      app.innerHTML = `

        <div class="mensaje">
          Caballo no encontrado.
        </div>

      `;

      return;

    }


    /*
      SI ESTÁ REGISTRADO EN SDU
      VA A LA FICHA GENEALÓGICA.
    */

    if (
      caballo.caballo_id
    ) {

      window.location.href =
        "index.html?caballo=" +
        encodeURIComponent(
          caballo.nombre_principal
        );


      return;

    }


    const [
      aliases,
      participantes
    ] =
      await Promise.all([

        apiGet(
          "alias_caballos" +
          "?select=*" +
          "&caballo_deportivo_id=eq." +
          encodeURIComponent(
            caballo.id
          ) +
          "&order=id.asc"
        ),

        apiGet(
          "participantes_competencia" +
          "?select=*" +
          "&caballo_deportivo_id=eq." +
          encodeURIComponent(
            caballo.id
          )
        )

      ]);


    const participanteIds =
      participantes.map(
        participante =>
          participante.id
      );


    const competenciaIds =
      [
        ...new Set(
          participantes
            .map(
              participante =>
                participante
                  .competencia_id
            )
        )
      ];


    let resultados =
      [];


    let competencias =
      [];


    if (
      participanteIds.length
    ) {

      resultados =
        await apiGet(
          "resultados_competencia" +
          "?select=*" +
          "&participante_id=in.(" +
          participanteIds.join(",") +
          ")"
        );

    }


    if (
      competenciaIds.length
    ) {

      competencias =
        await apiGet(
          "competencias" +
          "?select=*" +
          "&id=in.(" +
          competenciaIds.join(",") +
          ")"
        );

    }


    const mapaCompetencias =
      new Map();


    competencias.forEach(
      competencia => {

        mapaCompetencias.set(
          Number(
            competencia.id
          ),
          competencia
        );

      }
    );


    const mapaResultados =
      new Map();


    resultados.forEach(
      resultado => {

        mapaResultados.set(
          Number(
            resultado
              .participante_id
          ),
          resultado
        );

      }
    );


    /*
      ORDEN POR FECHA REAL DEL RAID:
      MÁS RECIENTE PRIMERO.
    */

    const campana =
      participantes
        .map(
          participante => ({

            participante,

            competencia:
              mapaCompetencias.get(
                Number(
                  participante
                    .competencia_id
                )
              ),

            resultado:
              mapaResultados.get(
                Number(
                  participante.id
                )
              )

          })
        )
        .filter(
          item =>
            item.competencia
        )
        .sort(
          (
            a,
            b
          ) => {

            const fechaA =
              a.competencia.fecha ||
              "";


            const fechaB =
              b.competencia.fecha ||
              "";


            if (
              fechaA !==
              fechaB
            ) {

              return fechaB
                .localeCompare(
                  fechaA
                );

            }


            return (
              Number(
                b.competencia.id
              ) -
              Number(
                a.competencia.id
              )
            );

          }
        );


    const conResultado =
      campana.filter(
        item =>
          item.resultado
      );


    const triunfos =
      conResultado.filter(
        item =>
          item.resultado
            .estado_resultado ===
            "clasificado" &&
          Number(
            item.resultado.puesto
          ) ===
          1
      ).length;


    const segundos =
      conResultado.filter(
        item =>
          item.resultado
            .estado_resultado ===
            "clasificado" &&
          Number(
            item.resultado.puesto
          ) ===
          2
      ).length;


    const terceros =
      conResultado.filter(
        item =>
          item.resultado
            .estado_resultado ===
            "clasificado" &&
          Number(
            item.resultado.puesto
          ) ===
          3
      ).length;


    const premiosFeu =
      conResultado.filter(
        item =>
          item.resultado
            .premio_feu
      ).length;


    app.innerHTML = `

      <div
        class="
          tarjeta
          ficha-caballo
        "
      >

        <h2>
          ${escapar(
            caballo.nombre_principal
          )}
        </h2>


        <p
          class="subtitulo"
        >
          Ficha deportiva ·
          Sangres del Uruguay
        </p>


        <div
          class="datos-caballo"
        >

          <div
            class="dato"
          >

            <strong>
              Propietario actual
            </strong>

            ${escapar(
              caballo
                .propietario_actual ||
              "-"
            )}

          </div>


          <div
            class="dato"
          >

            <strong>
              Chip
            </strong>

            ${escapar(
              caballo.chip ||
              "-"
            )}

          </div>


          <div
            class="dato"
          >

            <strong>
              Pasaporte FEU
            </strong>

            ${escapar(
              caballo
                .pasaporte_feu ||
              "-"
            )}

          </div>

        </div>


        ${
          aliases.length
            ? `

              <div
                style="
                  margin-top:15px;
                "
              >

                <strong>
                  Alias:
                </strong>

                ${
                  aliases
                    .map(
                      alias =>
                        escapar(
                          alias.alias
                        )
                    )
                    .join(", ")
                }

              </div>

            `
            : ""
        }


        <div
          class="
            resumen-deportivo
          "
        >

          <div
            class="resumen-item"
          >

            <strong>
              ${conResultado.length}
            </strong>

            <small>
              Competencias
            </small>

          </div>


          <div
            class="resumen-item"
          >

            <strong>
              ${triunfos}
            </strong>

            <small>
              Triunfos
            </small>

          </div>


          <div
            class="resumen-item"
          >

            <strong>
              ${segundos}
            </strong>

            <small>
              Segundos
            </small>

          </div>


          <div
            class="resumen-item"
          >

            <strong>
              ${terceros}
            </strong>

            <small>
              Terceros
            </small>

          </div>


          <div
            class="resumen-item"
          >

            <strong>
              ${premiosFeu}
            </strong>

            <small>
              ❤️🐴 FEU
            </small>

          </div>

        </div>

      </div>


      <div
        class="tarjeta"
      >

        <h3>
          Campaña deportiva
        </h3>


        ${
          campana.length
            ? `

              <div
                class="
                  tabla-contenedor
                "
              >

                <table>

                  <thead>

                    <tr>

                      <th>
                        Fecha
                      </th>

                      <th>
                        Raid
                      </th>

                      <th>
                        Distancia
                      </th>

                      <th>
                        Puesto
                      </th>

                      <th>
                        Estado
                      </th>

                      <th>
                        Promedio
                      </th>

                      <th>
                        Premio FEU
                      </th>

                      <th>
                        Observaciones
                      </th>

                    </tr>

                  </thead>


                  <tbody>

                    ${
                      campana
                        .map(
                          item =>
                            filaCampana(
                              item
                            )
                        )
                        .join("")
                    }

                  </tbody>

                </table>

              </div>

            `
            : `

              <div
                class="mensaje"
              >
                Todavía no hay
                resultados deportivos
                cargados.
              </div>

            `
        }

      </div>

    `;

  }

  catch (error) {

    console.error(
      error
    );


    app.innerHTML = `

      <div
        class="
          mensaje
          mensaje-error
        "
      >
        No se pudo cargar
        la ficha deportiva.
      </div>

    `;

  }

}


/* ==========================================================
   FILA DE CAMPAÑA
========================================================== */

function filaCampana(
  item
) {

  const competencia =
    item.competencia;


  const resultado =
    item.resultado;


  let puesto =
    "-";


  let estado =
    "-";


  let promedio =
    "-";


  let premio =
    "-";


  let observaciones =
    "-";


  if (resultado) {

    estado =
      resultado
        .estado_resultado ||
      "-";


    if (
      resultado
        .estado_resultado ===
        "clasificado" &&
      resultado.puesto !==
        null &&
      resultado.puesto !==
        undefined
    ) {

      puesto =
        resultado.puesto;

    }


    if (
      resultado
        .promedio_kmh !==
        null &&
      resultado
        .promedio_kmh !==
        undefined
    ) {

      promedio =
        resultado
          .promedio_kmh +
        " km/h";

    }


    if (
      resultado
        .premio_feu
    ) {

      premio =
        "❤️🐴";


      if (
        resultado
          .premio_feu_ppm !==
          null &&
        resultado
          .premio_feu_ppm !==
          undefined
      ) {

        premio +=
          " " +
          resultado
            .premio_feu_ppm +
          " ppm";

      }

    }


    observaciones =
      resultado
        .observaciones ||
      "-";

  }


  return `

    <tr>

      <td>
        ${fechaUY(
          competencia.fecha
        )}
      </td>


      <td>

        <a
          href="favoritos.html?raid=${encodeURIComponent(
            competencia.id
          )}"
          style="
            color:var(--azul);
            font-weight:700;
            text-decoration:none;
          "
        >
          ${escapar(
            competencia.nombre
          )}
        </a>

      </td>


      <td>

        ${
          competencia.distancia_km
            ? escapar(
                competencia
                  .distancia_km
              ) +
              " km"
            : "-"
        }

      </td>


      <td>
        ${escapar(
          puesto
        )}
      </td>


      <td>
        ${escapar(
          estado
        )}
      </td>


      <td>
        ${escapar(
          promedio
        )}
      </td>


      <td
        class="premio-feu"
      >
        ${premio}
      </td>


      <td>
        ${escapar(
          observaciones
        )}
      </td>

    </tr>

  `;

}


/* ==========================================================
   ROUTER
========================================================== */

async function cargarRuta() {

  const params =
    new URLSearchParams(
      window.location.search
    );


  const raid =
    params.get(
      "raid"
    );


  const caballo =
    params.get(
      "caballo"
    );


  window.scrollTo({
    top: 0,
    behavior: "instant"
  });


  if (caballo) {

    await mostrarCaballo(
      caballo
    );

    return;

  }


  if (raid) {

    await mostrarRaid(
      raid
    );

    return;

  }


  await mostrarInicio();

}


/* ==========================================================
   INICIO
========================================================== */

cargarRuta();

</script>
