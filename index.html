<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Sangres del Uruguay</title>

  <style>
    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: #f5f5f2;
      color: #17233b;
    }

    header {
      background: #17233b;
      color: white;
      text-align: center;
      padding: 35px 20px;
    }

    header h1 {
      margin: 0;
      font-size: 34px;
    }

    header p {
      margin-top: 8px;
      color: #d5b56b;
    }

    main {
      max-width: 900px;
      margin: 50px auto;
      padding: 20px;
    }

    .buscador {
      background: white;
      padding: 35px;
      border-radius: 12px;
      box-shadow: 0 3px 15px rgba(0,0,0,0.08);
      text-align: center;
    }

    .buscador h2 {
      margin-top: 0;
    }

    .buscar-fila {
      display: flex;
      gap: 10px;
      margin-top: 25px;
    }

    input {
      flex: 1;
      padding: 14px;
      border: 1px solid #ccc;
      border-radius: 7px;
      font-size: 16px;
    }

    button {
      padding: 14px 25px;
      border: none;
      border-radius: 7px;
      background: #17233b;
      color: white;
      font-size: 16px;
      cursor: pointer;
    }

    button:hover {
      background: #253758;
    }

    #resultado {
      margin-top: 30px;
    }

    @media (max-width: 600px) {
      .buscar-fila {
        flex-direction: column;
      }
    }
  </style>
</head>

<body>

  <header>
    <h1>Sangres del Uruguay</h1>
    <p>Registro y genealogía equina</p>
  </header>

  <main>

    <section class="buscador">
      <h2>Buscar caballo</h2>
      <p>Ingresá el nombre del caballo para consultar su información y genealogía.</p>

      <div class="buscar-fila">
        <input
          id="nombreCaballo"
          type="text"
          placeholder="Nombre del caballo"
        >
        <button onclick="buscarCaballo()">Buscar</button>
      </div>

      <div id="resultado"></div>
    </section>

  </main>

  <script>
    const SUPABASE_KEY = "sb_publishable_Q180CMeKmdMMVRa3WUBvIQ_0ceNY6zK";
    const SUPABASE_URL = "https://arsjvaueyjwntefogmqz.supabase.co";

    function escapar(texto) {
  return String(texto ?? "")
    .replaceAll("&", "&amp;")
    .replaceAll("<", "&lt;")
    .replaceAll(">", "&gt;");
}

async function buscarCaballo() {
  const nombre = document.getElementById("nombreCaballo").value.trim();
  const resultado = document.getElementById("resultado");

  if (!nombre) {
    resultado.innerHTML = "<p>Ingresá el nombre de un caballo.</p>";
    return;
  }

  resultado.innerHTML = "<p>Buscando <strong>" + escapar(nombre) + "</strong>...</p>";

  try {
    const url =
      SUPABASE_URL +
      "/rest/v1/Caballos?select=*&Nombre=eq." +
      encodeURIComponent(nombre);

    const respuesta = await fetch(url, {
      headers: {
        apikey: SUPABASE_KEY,
        Authorization: "Bearer " + SUPABASE_KEY
      }
    });

    if (!respuesta.ok) {
      throw new Error("Error " + respuesta.status);
    }

    const caballos = await respuesta.json();

    if (caballos.length === 0) {
      resultado.innerHTML = "<p>No se encontró ese caballo.</p>";
      return;
    }

    const caballo = caballos[0];

    resultado.innerHTML = `
      <h2>${escapar(caballo.Nombre)}</h2>
      <p><strong>Sexo:</strong> ${escapar(caballo.Sexo || "-")}</p>
      <p><strong>Nacimiento:</strong> ${escapar(caballo.Nacimiento || "-")}</p>
      <p><strong>RP:</strong> ${escapar(caballo.RP || "-")}</p>
    `;

  } catch (error) {
    console.error(error);
    resultado.innerHTML =
      "<p>No se pudo consultar la base de datos.</p>";
  }
}

</script>

</body>
</html>
