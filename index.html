<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Sangres del Uruguay</title>

  <style>
    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: #f5f5f2;
      color: #17233b;
    }

    header {
      background: #17233b;
      color: white;
      text-align: center;
      padding: 35px 20px;
    }

    header h1 {
      margin: 0;
      font-size: 34px;
    }

    header p {
      margin-top: 8px;
      color: #d5b56b;
    }

    main {
      max-width: 900px;
      margin: 50px auto;
      padding: 20px;
    }

    .buscador {
      background: white;
      padding: 35px;
      border-radius: 12px;
      box-shadow: 0 3px 15px rgba(0,0,0,0.08);
      text-align: center;
    }

    .buscador h2 {
      margin-top: 0;
    }

    .buscar-fila {
      display: flex;
      gap: 10px;
      margin-top: 25px;
    }

    input {
      flex: 1;
      padding: 14px;
      border: 1px solid #ccc;
      border-radius: 7px;
      font-size: 16px;
    }

    button {
      padding: 14px 25px;
      border: none;
      border-radius: 7px;
      background: #17233b;
      color: white;
      font-size: 16px;
      cursor: pointer;
    }

    button:hover {
      background: #253758;
    }

    #resultado {
      margin-top: 30px;
    }

    @media (max-width: 600px) {
      .buscar-fila {
        flex-direction: column;
      }
    }
    .pedigree {
  margin-top: 30px;
  overflow-x: auto;
  padding: 20px 0;
}

.pedigree-grid {
  display: grid;
  grid-template-columns: repeat(4, minmax(170px, 1fr));
  gap: 12px 25px;
  align-items: center;
  min-width: 850px;
}

.pedigree-persona {
  background: white;
  border: 2px solid #17233b;
  border-radius: 10px;
  padding: 10px;
  text-align: center;
  font-weight: bold;
  box-shadow: 0 3px 8px rgba(0,0,0,0.10);
}

.pedigree-titulo {
  font-size: 12px;
  color: #777;
  display: block;
  margin-bottom: 4px;
}

    /* CUADRO GENEALÓGICO HORIZONTAL */

.pedigree {
  display: grid;
  grid-template-columns: 190px 190px 190px 190px;
  gap: 12px 28px;
  align-items: center;
  width: max-content;
  min-width: 100%;
  margin-top: 20px;
}

.generacion {
  display: grid;
  align-items: center;
  gap: 0px;
}

.generacion.caballo {
  grid-template-rows: 1fr;
}

.generacion.padres {
  grid-template-rows: repeat(2, 360px);
}

.generacion.abuelos {
  grid-template-rows: repeat(4, 180px);
}

.generacion.bisabuelos {
  grid-template-rows: repeat(8, 90px);
}

.pedigree-box {
  min-height: 54px;
  padding: 8px 10px;
  border-radius: 8px;
  display: flex;
  align-items: center;
  justify-content: center;
  text-align: center;
  font-size: 13px;
  font-weight: 600;
  border: 1px solid rgba(0,0,0,0.12);
  box-sizing: border-box;
}

/* Caballo o yegua buscado */
.pedigree-box.principal {
  background: #fff3b0;
}

/* Machos */
.pedigree-box.macho {
  background: #d9efff;
}

/* Hembras */
.pedigree-box.hembra {
  background: #f9dce5;
}

.pedigree-vacio {
  height: 54px;
}

/* Datos superiores: propietario, criador, etc. */
.ficha-caballo {
  margin-bottom: 22px;
  text-align: center;
}

/* Permite mantener el árbol horizontal en pantallas chicas */
#resultado {
  overflow-x: auto;
  padding-bottom: 15px;
}
  </style>
</head>

<body>

  <header>
    <h1>Sangres del Uruguay</h1>
    <p>Registro y genealogía equina</p>
  </header>

  <main>

    <section class="buscador">
      <h2>Buscar caballo</h2>
      <p>Ingresá el nombre del caballo para consultar su información y genealogía.</p>

      <div class="buscar-fila">
        <input
          id="nombreCaballo"
          type="text"
          placeholder="Nombre del caballo"
        >
        <button onclick="buscarCaballo()">Buscar</button>
      </div>

      <div id="resultado"></div>
    </section>

  </main>

  <script>
    const SUPABASE_KEY = "sb_publishable_Q180CMeKmdMMVRa3WUBvIQ_0ceNY6zK";
    const SUPABASE_URL = "https://arsjvaueyjwntefogmqz.supabase.co";

    function escapar(texto) {
  return String(texto ?? "")
    .replaceAll("&", "&amp;")
    .replaceAll("<", "&lt;")
    .replaceAll(">", "&gt;");
}

async function buscarCaballo() {
  const nombre = document.getElementById("nombreCaballo").value.trim();
  const resultado = document.getElementById("resultado");

  if (!nombre) {
    resultado.innerHTML = "<p>Ingresá el nombre de un caballo.</p>";
    return;
  }

  resultado.innerHTML = "<p>Buscando <strong>" + escapar(nombre) + "</strong>...</p>";

  try {
   const url =
  SUPABASE_URL +
  "/rest/v1/Caballos?select=&Nombre=ilike." +
  encodeURIComponent("%" + nombre + "%") +
  "&order=Nombre.asc";

    const respuesta = await fetch(url, {
      headers: {
        apikey: SUPABASE_KEY,
        Authorization: "Bearer " + SUPABASE_KEY
      }
    });

    if (!respuesta.ok) {
      throw new Error("Error " + respuesta.status);
    }

    const caballos = await respuesta.json();

    if (caballos.length === 0) {
      resultado.innerHTML = "<p>No se encontró ese caballo.</p>";
      return;
    }
if (caballos.length > 1) {

  // Revisa si un padre o una madre están registrados como caballo
  async function caballoRegistrado(nombre) {
    if (!nombre) return false;

    try {
      const respuesta = await fetch(
        SUPABASE_URL +
        "/rest/v1/Caballos?select=Nombre&Nombre=eq." +
        encodeURIComponent(nombre) +
        "&limit=1",
        {
          headers: {
            apikey: SUPABASE_KEY,
            Authorization: "Bearer " + SUPABASE_KEY
          }
        }
      );

      if (!respuesta.ok) return false;

      const datos = await respuesta.json();
      return datos.length > 0;

    } catch (error) {
      return false;
    }
  }


  // Para no consultar dos veces el mismo padre o madre
  const nombresFamilia = [
    ...new Set(
      caballos
        .flatMap(c => [c.Padre, c.Madre])
        .filter(Boolean)
    )
  ];

  const registrados = {};

  await Promise.all(
    nombresFamilia.map(async nombre => {
      registrados[nombre] = await caballoRegistrado(nombre);
    })
  );


  function enlaceCaballo(nombre) {

    if (!nombre) return "-";

    // Si está registrado, queda azul y clickeable
    if (registrados[nombre]) {
      return `
        <button
          type="button"
          class="enlace-genealogia"
          data-caballo="${escapar(nombre)}"
        >
          ${escapar(nombre)}
        </button>
      `;
    }

    // Si no está registrado, queda como texto normal
    return escapar(nombre);
  }


  resultado.innerHTML = `
    <h3>Resultados encontrados</h3>

    <div class="tabla-resultados-wrap">

      <table class="tabla-resultados">

        <thead>
          <tr>
            <th>Nombre</th>
            <th>Nacimiento</th>
            <th>Sexo</th>
            <th>Padre</th>
            <th>Madre</th>
          </tr>
        </thead>

        <tbody>

          ${caballos.map(c => `
            <tr>

              <td>
                <button
                  type="button"
                  class="enlace-genealogia nombre-principal"
                  data-caballo="${escapar(c.Nombre)}"
                >
                  ${escapar(c.Nombre)}
                </button>
              </td>

              <td>
                ${c.Nacimiento || "-"}
              </td>

              <td>
                ${c.Sexo || "-"}
              </td>

              <td>
                ${enlaceCaballo(c.Padre)}
              </td>

              <td>
                ${enlaceCaballo(c.Madre)}
              </td>

            </tr>
          `).join("")}

        </tbody>

      </table>

    </div>
  `;


  // Hace clickeables Nombre, Padre y Madre registrados
  resultado
    .querySelectorAll(".enlace-genealogia")
    .forEach(boton => {

      boton.addEventListener("click", function() {

        const nombre = this.dataset.caballo;

        document.getElementById("nombreCaballo").value = nombre;

        buscarCaballo();

        window.scrollTo({
          top: 0,
          behavior: "smooth"
        });

      });

    });


  return;
}
    const caballo = caballos[0];
    let criador = null;

if (caballo["Criador ID"]) {
  const respuestaCriador = await fetch(
    SUPABASE_URL +
    "/rest/v1/Criadores?select=*&id=eq." +
    encodeURIComponent(caballo["Criador ID"]),
    {
      headers: {
        apikey: SUPABASE_KEY,
        Authorization: "Bearer " + SUPABASE_KEY
      }
    }
  );

  const criadores = await respuestaCriador.json();

  if (criadores.length > 0) {
    criador = criadores[0];
  }
}
function nodo(nombre, tipo) {
  if (!nombre) {
    return '<div class="pedigree-vacio"></div>';
  }

  return '<div class="pedigree-box ' + tipo + '"><strong>' +
    escapar(nombre) +
    '</strong></div>';
}

function dato(etiqueta, valor) {
  if (!valor) return '';
  return '<p><strong>' + etiqueta + ':</strong> ' + escapar(valor) + '</p>';
}
   resultado.innerHTML = `
  <div class="ficha-caballo">
    <h2>${escapar(caballo.Nombre)}</h2>

    ${caballo.Nacimiento ? `<p><strong>Nacimiento:</strong> ${escapar(caballo.Nacimiento)}</p>` : ""}
    ${caballo.RP ? `<p><strong>RP:</strong> ${escapar(caballo.RP)}</p>` : ""}
   ${dato("Criador", criador && criador.Nombre)}
${dato("N.º de criador", criador && criador["Numero de Criador"])}
${dato("Haras / Cabaña", criador && criador["Haras - Cabaña"])}
    ${caballo.Propietario ? `<p><strong>Propietario:</strong> ${escapar(caballo.Propietario)}</p>` : ""}
  </div>

  <div class="pedigree">

    <div class="generacion sujeto">
      <div class="pedigree-box principal">
        <strong>${escapar(caballo.Nombre)}</strong>
        ${caballo.Nacimiento ? `<small>Nac.: ${escapar(caballo.Nacimiento)}</small>` : ""}
      </div>
    </div>

    <div class="generacion padres">
      ${caballo.Padre ? `
        <div class="pedigree-box macho">
          <strong>${escapar(caballo.Padre)}</strong>
        </div>` : `<div class="pedigree-vacio"></div>`}

      ${caballo.Madre ? `
        <div class="pedigree-box hembra">
          <strong>${escapar(caballo.Madre)}</strong>
        </div>` : `<div class="pedigree-vacio"></div>`}
    </div>

    <div class="generacion abuelos">
      ${caballo.abuelo_paterno ? `<div class="pedigree-box macho"><strong>${escapar(caballo.abuelo_paterno)}</strong></div>` : `<div class="pedigree-vacio"></div>`}
      ${caballo.abuela_paterno ? `<div class="pedigree-box hembra"><strong>${escapar(caballo.abuela_paterno)}</strong></div>` : `<div class="pedigree-vacio"></div>`}
      ${caballo.abuelo_materno ? `<div class="pedigree-box macho"><strong>${escapar(caballo.abuelo_materno)}</strong></div>` : `<div class="pedigree-vacio"></div>`}
      ${caballo.abuela_materna ? `<div class="pedigree-box hembra"><strong>${escapar(caballo.abuela_materna)}</strong></div>` : `<div class="pedigree-vacio"></div>`}
    </div>

    <div class="generacion bisabuelos">
      ${caballo.bisabuelo_pp ? `<div class="pedigree-box macho"><strong>${escapar(caballo.bisabuelo_pp)}</strong></div>` : `<div class="pedigree-vacio"></div>`}
      ${caballo.bisabuela_pp ? `<div class="pedigree-box hembra"><strong>${escapar(caballo.bisabuela_pp)}</strong></div>` : `<div class="pedigree-vacio"></div>`}

      ${caballo.bisabuelo_pm ? `<div class="pedigree-box macho"><strong>${escapar(caballo.bisabuelo_pm)}</strong></div>` : `<div class="pedigree-vacio"></div>`}
      ${caballo.bisabuela_pm ? `<div class="pedigree-box hembra"><strong>${escapar(caballo.bisabuela_pm)}</strong></div>` : `<div class="pedigree-vacio"></div>`}

      ${caballo.bisabuelo_mp ? `<div class="pedigree-box macho"><strong>${escapar(caballo.bisabuelo_mp)}</strong></div>` : `<div class="pedigree-vacio"></div>`}
      ${caballo.bisabuela_mp ? `<div class="pedigree-box hembra"><strong>${escapar(caballo.bisabuela_mp)}</strong></div>` : `<div class="pedigree-vacio"></div>`}

      ${caballo.bisabuelo_mm ? `<div class="pedigree-box macho"><strong>${escapar(caballo.bisabuelo_mm)}</strong></div>` : `<div class="pedigree-vacio"></div>`}
      ${caballo.bisabuela_mm ? `<div class="pedigree-box hembra"><strong>${escapar(caballo.bisabuela_mm)}</strong></div>` : `<div class="pedigree-vacio"></div>`}
    </div>

  </div>
`;

  } catch (error) {
    console.error(error);
    resultado.innerHTML =
      "<p>No se pudo consultar la base de datos.</p>";
  }
}

</script>

</body>
</html>
