      header {
  padding: 24px 16px 24px 95px;

}

.header-logo-sdu {
  width: 58px;
  left: 20px;
}

header h1 {
  font-size: 28px;
  line-height: 1.05;
  margin: 0 0 8px 0;
}

header p {
  font-size: 16px;
  line-height: 1.2;
  margin: 0;
}
      .tabla-resultados {
  min-width: 760px;
}

#resultado {
  overflow-x: auto;
  -webkit-overflow-scrolling: touch;
}

.tabla-resultados th,
.tabla-resultados td {
  white-space: normal;
  padding: 10px 12px;
}
    }
    .pedigree {
  margin-top: 30px;
  overflow-x: auto;
  padding: 20px 0;
}

.pedigree-grid {
  display: grid;
  grid-template-columns: repeat(4, minmax(170px, 1fr));
  gap: 12px 25px;
  align-items: center;
  min-width: 850px;
}

.pedigree-persona {
  background: white;
  border: 2px solid #17233b;
  border-radius: 10px;
  padding: 10px;
  text-align: center;
  font-weight: bold;
  box-shadow: 0 3px 8px rgba(0,0,0,0.10);
}

.pedigree-titulo {
  font-size: 12px;
  color: #777;
  display: block;
  margin-bottom: 4px;
}

    /* CUADRO GENEALÓGICO HORIZONTAL */

.pedigree {
  display: grid;
  grid-template-columns: 190px 190px 190px 190px;
  gap: 12px 28px;
  align-items: center;
  width: max-content;
  min-width: 100%;
  margin-top: 20px;
}

.generacion {
  display: grid;
  align-items: center;
  gap: 0px;
}

.generacion.caballo {
  grid-template-rows: 1fr;
}

.generacion.padres {
  grid-template-rows: repeat(2, 360px);
}

.generacion.abuelos {
  grid-template-rows: repeat(4, 180px);
}

.generacion.bisabuelos {
  grid-template-rows: repeat(8, 90px);
}

.pedigree-box {
  min-height: 54px;
  padding: 8px 10px;
  border-radius: 8px;
  display: flex;
  align-items: center;
  justify-content: center;
  text-align: center;
  font-size: 13px;
  font-weight: 600;
  border: 1px solid rgba(0,0,0,0.12);
  box-sizing: border-box;
}

/* Caballo o yegua buscado */
.pedigree-box.principal {
  background: #fff3b0;
}

/* Machos */
.pedigree-box.macho {
  background: #d9efff;
}

/* Hembras */
.pedigree-box.hembra {
  background: #f9dce5;
}

.pedigree-vacio {
  height: 54px;
}

/* Datos superiores: propietario, criador, etc. */
.ficha-caballo {
  margin-bottom: 22px;
  text-align: center;
}

/* Permite mantener el árbol horizontal en pantallas chicas */
#resultado {
  overflow-x: auto;
  padding-bottom: 15px;
}
    /* ===== TABLA DE RESULTADOS ===== */

.tabla-resultados-wrap {
  width: 100%;
  margin-top: 20px;
  overflow-x: auto;
}

.tabla-resultados {
  width: 100%;
  border-collapse: collapse;
  background: white;
  table-layout: fixed;
}

/* Encabezados */
.tabla-resultados th {
  text-align: left;
  padding: 14px 12px;
  font-weight: 700;
  color: #333;
  background: #f5f5f5;
  border-top: 1px solid #d8d8d8;
  border-bottom: 2px solid #cfcfcf;
}

/* Renglones */
.tabla-resultados td {
  padding: 14px 12px;
  text-align: left;
  vertical-align: middle;
  border-bottom: 1px solid #dddddd;
}

/* Suave efecto al pasar el mouse */
.tabla-resultados tbody tr:hover {
  background: #fafafa;
}

/* Nombres registrados: azul + subrayado, SIN botón */
.enlace-genealogia,
.nombre-principal {
  background: transparent !important;
  border: 0 !important;
  border-radius: 0 !important;
  box-shadow: none !important;
  padding: 0 !important;
  margin: 0 !important;

  color: #0b4ea2 !important;
  font-family: inherit !important;
  font-size: inherit !important;
  font-weight: 600 !important;

  text-decoration: underline !important;
  text-underline-offset: 2px;
  cursor: pointer;
}

.enlace-genealogia:hover,
.nombre-principal:hover {
  color: #063879 !important;
}

/* Tamaño de las columnas */
.tabla-resultados th:nth-child(1),
.tabla-resultados td:nth-child(1) {
  width: 24%;
}

.tabla-resultados th:nth-child(2),
.tabla-resultados td:nth-child(2) {
  width: 16%;
}

.tabla-resultados th:nth-child(3),
.tabla-resultados td:nth-child(3) {
  width: 10%;
}

.tabla-resultados th:nth-child(4),
.tabla-resultados td:nth-child(4) {
  width: 25%;
}

.tabla-resultados th:nth-child(5),
.tabla-resultados td:nth-child(5) {
  width: 25%;
}
 /* TABLA DE INFORMACIÓN DEL CABALLO */
.tabla-ficha {

.dato-ficha {

.dato-ficha:nth-child(3n) {

}

.dato-ficha:nth-child(n+4) {

.ficha-caballo h2 {

    header {

.header-logo-sdu {

    .pedigree {

.pedigree-watermark {

.pedigree-watermark img {

.pedigree .generacion {

    .pedigree-box[data-nombre] {

.pedigree-box[data-nombre]:hover {

function abrirLogin() {
  const email = prompt("Email de administrador:");
  if (!email) return;

  const password = prompt("Contraseña:");
  if (!password) return;

  iniciarSesionAdmin(email, password);
}

async function iniciarSesionAdmin(email, password) {
  const respuesta = await fetch(
    SUPABASE_URL + "/auth/v1/token?grant_type=password",
    {
      method: "POST",
      headers: {
        apikey: SUPABASE_KEY,
        "Content-Type": "application/json"
      },
      body: JSON.stringify({
        email: email,
        password: password
      })
    }
  );

  const datos = await respuesta.json();

  if (!respuesta.ok) {
    alert("Email o contraseña incorrectos.");
    return;
  }

  sesionAdmin = datos;
  localStorage.setItem("sesionAdminSdU", JSON.stringify(datos));

  document.getElementById("btnLogin").textContent = "Administrador";
  alert("Sesión iniciada correctamente.");
}
const sesionGuardada = localStorage.getItem("sesionAdminSdU");

if (sesionGuardada) {
  sesionAdmin = JSON.parse(sesionGuardada);
  document.getElementById("btnLogin").textContent = "Administrador";
}
    function escapar(texto) {
  return String(texto ?? "")
    .replaceAll("&", "&amp;")
    .replaceAll("<", "&lt;")
    .replaceAll(">", "&gt;");
}
    async function editarCaballo(id) {
  if (!sesionAdmin || !sesionAdmin.access_token) {
    alert("Primero tenés que iniciar sesión como administrador.");
    return;
  }

  const respuestaCaballo = await fetch(
    SUPABASE_URL + "/rest/v1/Caballos?select=*&id=eq." + encodeURIComponent(id),
    {
      headers: {
        apikey: SUPABASE_KEY,
        Authorization: "Bearer " + sesionAdmin.access_token
      }
    }
  );

  const caballos = await respuestaCaballo.json();

  if (!caballos.length) {
    alert("No se encontró el caballo.");
    return;
  }

  const caballo = caballos[0];

  const nombre = prompt("Nombre:", caballo.Nombre || "");
  if (nombre === null) return;

  const nacimiento = prompt("Nacimiento:", caballo.Nacimiento || "");
  if (nacimiento === null) return;

  const pelo = prompt("Pelo:", caballo.Pelo || "");
  if (pelo === null) return;

  const rp = prompt("RP:", caballo.RP || "");
  if (rp === null) return;

  const padre = prompt("Padre:", caballo.Padre || "");
  if (padre === null) return;

  const madre = prompt("Madre:", caballo.Madre || "");
  if (madre === null) return;

  const respuestaGuardar = await fetch(
    SUPABASE_URL + "/rest/v1/Caballos?id=eq." + encodeURIComponent(id),
    {
      method: "PATCH",
      headers: {
        apikey: SUPABASE_KEY,
        Authorization: "Bearer " + sesionAdmin.access_token,
        "Content-Type": "application/json"
      },
      body: JSON.stringify({
        Nombre: nombre,
        Nacimiento: nacimiento || null,
        Pelo: pelo || null,
        RP: rp || null,
        Padre: padre || null,
        Madre: madre || null
      })
    }
  );

  if (!respuestaGuardar.ok) {
    const error = await respuestaGuardar.text();
    console.error(error);
    alert("No se pudieron guardar los cambios.");
    return;
  }

  alert("Cambios guardados correctamente.");

  document.getElementById("nombreCaballo").value = nombre;
  buscarCaballo();
}

elemento.classList.add("modo-pdf");

  };

  html2pdf()
  .set(opciones)
  .from(elemento)
  .save()
  .then(() => {
    elemento.classList.remove("modo-pdf");
