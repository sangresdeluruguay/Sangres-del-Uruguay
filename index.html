    /* CUADRO GENEALÓGICO HORIZONTAL */

.pedigree {
  display: grid;

  width: max-content;
  min-width: 100%;

.generacion {

  align-items: center;
  gap: 0px;
}

.generacion.caballo {
  grid-template-rows: 1fr;
}

.generacion.padres {
  grid-template-rows: repeat(2, 360px);
}

.generacion.abuelos {
  grid-template-rows: repeat(4, 180px);
}

.generacion.bisabuelos {
  grid-template-rows: repeat(8, 90px);
}

.pedigree-box {

}

.tabla-resultados {

}

.tabla-resultados th {

  padding: 14px 12px;
  font-weight: 700;
  color: #333;
  background: #f5f5f5;

}

/* Renglones */
.tabla-resultados td {
  padding: 14px 12px;
  text-align: left;
  vertical-align: middle;
  border-bottom: 1px solid #dddddd;
}

/* Suave efecto al pasar el mouse */

}

/* Nombres registrados: azul + subrayado, SIN botón */

    async function validarCriadorParaCaballo() {
  const numero = document
    .getElementById("registroCaballoNumeroCriador")
    .value
    .trim()
    .toUpperCase();

  if (!numero) {
    alert("Ingresá tu número de criador.");
    return;
  }

  const respuesta = await fetch(
    SUPABASE_URL +
      "/rest/v1/Criadores?select=*&Numero%20de%20Criador=eq." +
      encodeURIComponent(numero),
    {
      headers: {
        apikey: SUPABASE_KEY,
        Authorization: "Bearer " + SUPABASE_KEY
      }
    }
  );

  const criadores = await respuesta.json();

  if (!respuesta.ok || !criadores.length) {
    alert("El número de criador no está registrado o todavía no fue aprobado.");
    return;
  }

  mostrarFormularioCaballo(numero, criadores[0]);
}

async function renovarSesionAdmin() {
  const sesionGuardada = localStorage.getItem("sesionAdminSdU");

  if (!sesionGuardada) {
    sesionAdmin = null;
    document.getElementById("btnLogin").textContent = "Ingresar";
    return false;
  }

  sesionAdmin = JSON.parse(sesionGuardada);

  if (!sesionAdmin.refresh_token) {
    localStorage.removeItem("sesionAdminSdU");
    sesionAdmin = null;
    document.getElementById("btnLogin").textContent = "Ingresar";
    return false;
  }

  const respuesta = await fetch(
    SUPABASE_URL + "/auth/v1/token?grant_type=refresh_token",
    {
      method: "POST",
      headers: {
        apikey: SUPABASE_KEY,
        "Content-Type": "application/json"
      },
      body: JSON.stringify({
        refresh_token: sesionAdmin.refresh_token
      })
    }
  );

  if (!respuesta.ok) {
    localStorage.removeItem("sesionAdminSdU");
    sesionAdmin = null;
    document.getElementById("btnLogin").textContent = "Ingresar";
    return false;
  }

  const nuevaSesion = await respuesta.json();

  sesionAdmin = nuevaSesion;
  localStorage.setItem(
    "sesionAdminSdU",
    JSON.stringify(nuevaSesion)
  );

  document.getElementById("btnLogin").textContent = "Administrador";
  document.getElementById("btnPanelAdmin").style.display = "inline-block";

  return true;
}

    async function aprobarCaballoPendiente(id) {
  if (!sesionAdmin || !sesionAdmin.access_token) {
    alert("Tenés que iniciar sesión como administrador.");
    return;
  }

  // 1. Traer la solicitud
  const respuestaSolicitud = await fetch(
    SUPABASE_URL + "/rest/v1/SolicitudesCaballos?select=*&id=eq." + id,
    {
      headers: {
        apikey: SUPABASE_KEY,
        Authorization: "Bearer " + sesionAdmin.access_token
      }
    }
  );

  const solicitudes = await respuestaSolicitud.json();

  if (!respuestaSolicitud.ok || !solicitudes.length) {
    alert("No se pudo encontrar la solicitud del caballo.");
    return;
  }

  const solicitud = solicitudes[0];

  // 2. Buscar el ID del criador por su número
  const numeroCriador = (solicitud["Numero de Criador"] || "").trim();

  const respuestaCriador = await fetch(
    SUPABASE_URL +
    "/rest/v1/Criadores?select=id&Numero%20de%20Criador=eq." +
    encodeURIComponent(numeroCriador) +
    "&limit=1",
    {
      headers: {
        apikey: SUPABASE_KEY,
        Authorization: "Bearer " + SUPABASE_KEY
      }
    }
  );

  const criadores = await respuestaCriador.json();

  if (!respuestaCriador.ok || !criadores.length) {
    alert("No se encontró el criador " + numeroCriador + ".");
    return;
  }

  const criadorId = criadores[0].id;

  // 3. Buscar propietario si ya existe
  let propietarioId = null;

  if (solicitud.Propietario) {
    const respuestaPropietario = await fetch(
      SUPABASE_URL +
      "/rest/v1/Propietarios?select=id&Nombre=eq." +
      encodeURIComponent(solicitud.Propietario) +
      "&limit=1",
      {
        headers: {
          apikey: SUPABASE_KEY,
          Authorization: "Bearer " + SUPABASE_KEY
        }
      }
    );

    const propietarios = await respuestaPropietario.json();

    if (respuestaPropietario.ok && propietarios.length) {
      propietarioId = propietarios[0].id;
    }
  }

  // 4. Convertir el sexo al formato de Caballos: H / MC / ME
  let sexo = (solicitud.Sexo || "").trim().toUpperCase();

  if (sexo === "HEMBRA") sexo = "H";
  if (sexo === "MACHO ENTERO") sexo = "ME";
  if (sexo === "MACHO CASTRADO") sexo = "MC";

  // 5. Preparar caballo oficial
  const caballoNuevo = {
    Nombre: (solicitud.Nombre || "").toUpperCase(),
    Sexo: sexo || null,
    Nacimiento: solicitud.Nacimiento || null,
    RP: solicitud.RP || null,
    Raza: solicitud.Raza || null,
    Pelo: solicitud.Pelo || null,
    "Criador ID": criadorId,
    "Propietario ID": propietarioId,

    Padre: solicitud.Padre || null,
    Madre: solicitud.Madre || null,

    abuelo_paterno: solicitud["Abuelo paterno"] || null,
    abuela_paterno: solicitud["Abuela paterna"] || null,
    abuelo_materno: solicitud["Abuelo materno"] || null,
    abuela_materna: solicitud["Abuela materna"] || null,

    bisabuelo_pp: solicitud["Bisabuelo paterno paterno"] || null,
    bisabuela_pp: solicitud["Bisabuela paterna paterna"] || null,
    bisabuelo_pm: solicitud["Bisabuelo paterno materno"] || null,
    bisabuela_pm: solicitud["Bisabuela paterna materna"] || null,

    bisabuelo_mp: solicitud["Bisabuelo materno paterno"] || null,
    bisabuela_mp: solicitud["Bisabuela materna paterna"] || null,
    bisabuelo_mm: solicitud["Bisabuelo materno materno"] || null,
    bisabuela_mm: solicitud["Bisabuela materna materna"] || null
  };

  // 6. Guardar en la tabla oficial Caballos
  const respuestaCaballo = await fetch(
    SUPABASE_URL + "/rest/v1/Caballos",
    {
      method: "POST",
      headers: {
        apikey: SUPABASE_KEY,
        Authorization: "Bearer " + sesionAdmin.access_token,
        "Content-Type": "application/json"
      },
      body: JSON.stringify(caballoNuevo)
    }
  );

  if (!respuestaCaballo.ok) {
    const error = await respuestaCaballo.text();
    alert("No se pudo aprobar el caballo: " + error);
    return;
  }

  // 7. Marcar solicitud como aprobada
  const respuestaEstado = await fetch(
    SUPABASE_URL + "/rest/v1/SolicitudesCaballos?id=eq." + id,
    {
      method: "PATCH",
      headers: {
        apikey: SUPABASE_KEY,
        Authorization: "Bearer " + sesionAdmin.access_token,
        "Content-Type": "application/json"
      },
      body: JSON.stringify({
        Estado: "aprobado"
      })
    }
  );

  if (!respuestaEstado.ok) {
    alert("El caballo se guardó, pero no se pudo actualizar el estado de la solicitud.");
    return;
  }

  alert("Caballo aprobado y registrado correctamente.");
  verCaballosPendientes();
}

        SUPABASE_URL +
        "/rest/v1/Caballos?select=Nombre&Nombre=eq." +
        encodeURIComponent(nombre) +
        "&limit=1",
        {
          headers: {
            apikey: SUPABASE_KEY,
            Authorization: "Bearer " + SUPABASE_KEY
          }
        }
      );

      if (!respuesta.ok) return false;

      const datos = await respuesta.json();
      return datos.length > 0;

    } catch (error) {
      return false;
    }
  }
