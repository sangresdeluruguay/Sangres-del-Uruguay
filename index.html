    .pedigree {

.pedigree-grid {
  display: grid;

  align-items: center;

}

.pedigree-persona {

    /* CUADRO GENEALÓGICO HORIZONTAL */

.pedigree {
  display: grid;
  grid-template-columns: 190px 190px 190px 190px;
  gap: 12px 28px;
  align-items: center;
  width: max-content;
  min-width: 100%;
  margin-top: 20px;
}

.generacion {
  display: grid;
  align-items: center;
  gap: 0px;
}

.generacion.caballo {
  grid-template-rows: 1fr;
}

.generacion.padres {
  grid-template-rows: repeat(2, 360px);
}

.generacion.abuelos {
  grid-template-rows: repeat(4, 180px);
}

.generacion.bisabuelos {
  grid-template-rows: repeat(8, 90px);
}

.pedigree-box {
  min-height: 54px;
  padding: 8px 10px;
  border-radius: 8px;
  display: flex;
  align-items: center;
  justify-content: center;
  text-align: center;
  font-size: 13px;
  font-weight: 600;
  border: 1px solid rgba(0,0,0,0.12);
  box-sizing: border-box;
}

.sugerencias-pedigree:empty {

}

  font-size: 11px;

}

  align-items: stretch;
  justify-content: flex-start;
}

.pedigree-box:has(.sugerencias-pedigree) > input {
  width: 100%;
  box-sizing: border-box;
}

/* Caballo o yegua buscado */
.pedigree-box.principal {
  background: #fff3b0;
}

/* Machos */
.pedigree-box.macho {
  background: #d9efff;
}

/* Hembras */
.pedigree-box.hembra {
  background: #f9dce5;
}

.pedigree-vacio {
  height: 54px;
}

/* Datos superiores: propietario, criador, etc. */
.ficha-caballo {

  text-align: center;
}

/* Permite mantener el árbol horizontal en pantallas chicas */
#resultado {

  padding-bottom: 15px;
}

.tabla-resultados-wrap {
  width: 100%;

  overflow-x: auto;
}

.tabla-resultados {
  width: 100%;

  background: white;
  table-layout: fixed;
}

/* Encabezados */
.tabla-resultados th {

  padding: 14px 12px;
  font-weight: 700;
  color: #333;
  background: #f5f5f5;

  border-bottom: 2px solid #cfcfcf;
}

/* Renglones */
.tabla-resultados td {
  padding: 14px 12px;

  border-bottom: 1px solid #dddddd;
}

/* Suave efecto al pasar el mouse */
.tabla-resultados tbody tr:hover {

}

/* Nombres registrados: azul + subrayado, SIN botón */
.enlace-genealogia,
.nombre-principal {

}

.enlace-genealogia:hover,
.nombre-principal:hover {

}

/* Tamaño de las columnas */
.tabla-resultados th:nth-child(1),
.tabla-resultados td:nth-child(1) {
  width: 24%;
}

.tabla-resultados th:nth-child(2),
.tabla-resultados td:nth-child(2) {
  width: 16%;
}

.tabla-resultados th:nth-child(3),
.tabla-resultados td:nth-child(3) {
  width: 10%;
}

.tabla-resultados th:nth-child(4),
.tabla-resultados td:nth-child(4) {
  width: 25%;
}

.tabla-resultados th:nth-child(5),
.tabla-resultados td:nth-child(5) {
  width: 25%;

async function buscarPedigreeRegistroPublico(texto, sexoPermitido) {
  const busqueda = texto.trim().toLowerCase();

  if (busqueda.length < 3) return [];

  async function obtenerDatos(url) {
    try {
      const respuesta = await fetch(url, {
        headers: {
          apikey: SUPABASE_KEY,
          Authorization: "Bearer " + SUPABASE_KEY
        }
      });

      if (!respuesta.ok) return [];

      return await respuesta.json();
    } catch (error) {
      return [];
    }
  }

 const respuestaPedigree = await fetch(
  SUPABASE_URL + "/rest/v1/rpc/obtener_pedigree_publico",
  {
    method: "POST",
    headers: {
      apikey: SUPABASE_KEY,
      Authorization: "Bearer " + SUPABASE_KEY,
      "Content-Type": "application/json"
    },
    body: JSON.stringify({})
  }
);

if (!respuestaPedigree.ok) {
  console.error(
    "Error leyendo pedigree:",
    await respuestaPedigree.text()
  );
  return [];
}

let datosPedigree = await respuestaPedigree.json();

if (typeof datosPedigree === "string") {
  datosPedigree = JSON.parse(datosPedigree);
}

if (!Array.isArray(datosPedigree)) {
  console.error("Pedigree recibido no es una lista:", datosPedigree);
  return [];
}

const registrados = datosPedigree.filter(function(caballo) {
  return String(caballo.Origen || "").toLowerCase() === "registrado";
});

const pendientes = datosPedigree.filter(function(caballo) {
  return String(caballo.Origen || "").toLowerCase() === "pendiente";
});

  const encontrados = new Map();

  function agregar(
    nombre,
    sexo,
    padre,
    madre,
    abueloPaterno,
    abuelaPaterna,
    abueloMaterno,
    abuelaMaterna
  ) {
    if (!nombre) return;

    const nombreLimpio = String(nombre).trim();

    if (!nombreLimpio) return;

    if (!nombreLimpio.toLowerCase().includes(busqueda)) return;

    if (sexoPermitido === "M" && sexo === "H") return;

    if (
      sexoPermitido === "H" &&
      (sexo === "ME" || sexo === "MC" || sexo === "M")
    ) {
      return;
    }

    const clave = nombreLimpio.toLowerCase();

    const nuevo = {
      Nombre: nombreLimpio,
      Padre: padre || "",
      Madre: madre || "",
      AbueloPaterno: abueloPaterno || "",
      AbuelaPaterna: abuelaPaterna || "",
      AbueloMaterno: abueloMaterno || "",
      AbuelaMaterna: abuelaMaterna || ""
    };

    if (!encontrados.has(clave)) {
      encontrados.set(clave, nuevo);
      return;
    }

    const existente = encontrados.get(clave);

    if (!existente.Padre && nuevo.Padre) {
      existente.Padre = nuevo.Padre;
    }

    if (!existente.Madre && nuevo.Madre) {
      existente.Madre = nuevo.Madre;
    }

    if (!existente.AbueloPaterno && nuevo.AbueloPaterno) {
      existente.AbueloPaterno = nuevo.AbueloPaterno;
    }

    if (!existente.AbuelaPaterna && nuevo.AbuelaPaterna) {
      existente.AbuelaPaterna = nuevo.AbuelaPaterna;
    }

    if (!existente.AbueloMaterno && nuevo.AbueloMaterno) {
      existente.AbueloMaterno = nuevo.AbueloMaterno;
    }

    if (!existente.AbuelaMaterna && nuevo.AbuelaMaterna) {
      existente.AbuelaMaterna = nuevo.AbuelaMaterna;
    }
  }

  // ----------------------------------------------------------
  // CABALLOS YA APROBADOS
  // ----------------------------------------------------------

  registrados.forEach(function (caballo) {

    // Caballo registrado como individuo
    agregar(
      caballo.Nombre,
      caballo.Sexo,
      caballo.Padre,
      caballo.Madre,
      caballo.abuelo_paterno,
      caballo.abuela_paterno,
      caballo.abuelo_materno,
      caballo.abuela_materna
    );

    // PADRE
    agregar(
      caballo.Padre,
      "M",
      caballo.abuelo_paterno,
      caballo.abuela_paterno,
      caballo.bisabuelo_pp,
      caballo.bisabuela_pp,
      caballo.bisabuelo_pm,
      caballo.bisabuela_pm
    );

    // MADRE
    agregar(
      caballo.Madre,
      "H",
      caballo.abuelo_materno,
      caballo.abuela_materna,
      caballo.bisabuelo_mp,
      caballo.bisabuela_mp,
      caballo.bisabuelo_mm,
      caballo.bisabuela_mm
    );

    // ABUELO PATERNO
    agregar(
      caballo.abuelo_paterno,
      "M",
      caballo.bisabuelo_pp,
      caballo.bisabuela_pp
    );

    // ABUELA PATERNA
    agregar(

      return (
        nombre.includes(buscado) ||
        numero.includes(buscado) ||
        haras.includes(buscado)
      );

    coincidencias.forEach(function (criador) {

  fondo.style.display = "flex";
  fondo.style.alignItems = "center";
  fondo.style.justifyContent = "center";
  fondo.style.padding = "20px";
  fondo.style.boxSizing = "border-box";

  const imagen = document.createElement("img");
  imagen.src = src;
  imagen.alt = alt || "Foto del caballo";
  imagen.style.maxWidth = "95%";
  imagen.style.maxHeight = "90%";
  imagen.style.objectFit = "contain";
  imagen.style.borderRadius = "10px";

  const cerrar = document.createElement("button");
  cerrar.innerHTML = "×";
  cerrar.type = "button";
  cerrar.style.position = "absolute";
  cerrar.style.top = "15px";
  cerrar.style.right = "20px";
  cerrar.style.fontSize = "38px";
  cerrar.style.color = "white";
  cerrar.style.background = "transparent";
  cerrar.style.border = "none";
  cerrar.style.cursor = "pointer";

  function cerrarFoto() {
    fondo.remove();
    document.body.style.overflow = "";
  }

  cerrar.onclick = cerrarFoto;

  fondo.onclick = function(evento) {
    if (evento.target === fondo) {
      cerrarFoto();
    }
  };

  fondo.appendChild(imagen);
  fondo.appendChild(cerrar);
  document.body.appendChild(fondo);
  document.body.style.overflow = "hidden";
}
    
    async function proponerFotoCaballo(nombreCaballo, caballoId) {
  const input = document.createElement("input");
  input.type = "file";
  input.accept = "image/jpeg,image/png,image/webp";

  input.onchange = async function () {
    const archivo = input.files && input.files[0];
    if (!archivo) return;

    if (!archivo.type.startsWith("image/")) {
      alert("Seleccioná una imagen válida.");
      return;
    }

    if (archivo.size > 10 * 1024 * 1024) {
      alert("La foto no puede superar los 10 MB.");
      return;
    }

    try {
      const extension = archivo.name.split(".").pop().toLowerCase();
      const fotoPath =
        "solicitudes/" +
        caballoId +
        "-" +
        Date.now() +
        "." +
        extension;

      const respuestaFoto = await fetch(
        SUPABASE_URL + "/storage/v1/object/fotos-caballos/" + fotoPath,
        {
          method: "POST",
          headers: {
            apikey: SUPABASE_KEY,
            Authorization: "Bearer " + SUPABASE_KEY,
            "Content-Type": archivo.type
          },
          body: archivo
        }
      );

      if (!respuestaFoto.ok) {
        throw new Error("No se pudo subir la foto.");
      }

      const respuestaSolicitud = await fetch(
        SUPABASE_URL + '/rest/v1/SolicitudesFotosCaballos',
        {
          method: "POST",
          headers: {
            apikey: SUPABASE_KEY,
            Authorization: "Bearer " + SUPABASE_KEY,
            "Content-Type": "application/json",
            Prefer: "return=minimal"
          },
          body: JSON.stringify({
            caballo_id: Number(caballoId),
            caballo_nombre: nombreCaballo,
            foto_path: fotoPath,
            estado: "pendiente"
          })
        }
      );

      if (!respuestaSolicitud.ok) {
        throw new Error("No se pudo registrar la solicitud.");
      }

      alert("✅ Foto enviada. Quedará visible cuando sea aprobada por el administrador.");

    } catch (error) {
      console.error(error);
      alert("No se pudo enviar la foto. Intentá nuevamente.");
    }
  };

  input.click();
}

    {
      method: "POST",
      headers: {
        apikey: SUPABASE_KEY,
        "Content-Type": "application/json"
      },
      body: JSON.stringify({
        refresh_token: sesionAdmin.refresh_token
      })
    }
  );

  if (!respuesta.ok) {
    localStorage.removeItem("sesionAdminSdU");
    sesionAdmin = null;
    document.getElementById("btnLogin").textContent = "Ingresar";
    return false;
  }

  const nuevaSesion = await respuesta.json();

  sesionAdmin = nuevaSesion;
  localStorage.setItem(
    "sesionAdminSdU",
    JSON.stringify(nuevaSesion)
  );

  document.getElementById("btnLogin").textContent = "Administrador";
  document.getElementById("btnPanelAdmin").style.display = "inline-block";

  return true;
}

async function buscarSugerenciasAncestros(texto, sexoPermitido) {
  const busqueda = texto.trim().toLowerCase();

  if (busqueda.length < 3) return [];

  const respuesta = await fetch(
    SUPABASE_URL +
    "/rest/v1/Caballos?select=Nombre,Sexo,Padre,Madre,abuelo_paterno,abuela_paterno,abuelo_materno,abuela_materna,bisabuelo_pp,bisabuela_pp,bisabuelo_pm,bisabuela_pm,bisabuelo_mp,bisabuela_mp,bisabuelo_mm,bisabuela_mm&limit=1000",
    {
      headers: {
        apikey: SUPABASE_KEY,
        Authorization: "Bearer " + SUPABASE_KEY
      }
    }
  );

  if (!respuesta.ok) return [];

  const caballos = await respuesta.json();

  const encontrados = new Map();

  function agregar(nombre, padre, madre) {
    if (!nombre) return;

    if (!nombre.toLowerCase().includes(busqueda)) return;

    const clave = nombre.trim().toLowerCase();

    if (!encontrados.has(clave)) {
      encontrados.set(clave, {
        Nombre: nombre,
        Padre: padre || "",
        Madre: madre || ""
      });
    } else {
      const existente = encontrados.get(clave);

      if (!existente.Padre && padre) existente.Padre = padre;
      if (!existente.Madre && madre) existente.Madre = madre;
    }
  }

  caballos.forEach(function (caballo) {

    if (sexoPermitido === "M") {

      if (caballo.Sexo === "ME" || caballo.Sexo === "MC") {
        agregar(
          caballo.Nombre,
          caballo.Padre,
          caballo.Madre
        );
      }

      agregar(
        caballo.Padre,
        caballo.abuelo_paterno,
        caballo.abuela_paterno
      );

      agregar(
        caballo.abuelo_paterno,
        caballo.bisabuelo_pp,
        caballo.bisabuela_pp
      );

      agregar(
        caballo.abuelo_materno,
        caballo.bisabuelo_mp,
        caballo.bisabuela_mp
      );
    }

    if (sexoPermitido === "H") {

      if (caballo.Sexo === "H") {
        agregar(
          caballo.Nombre,
          caballo.Padre,
          caballo.Madre
        );
      }

      agregar(
        caballo.Madre,
        caballo.abuelo_materno,
        caballo.abuela_materna
      );

      agregar(
        caballo.abuela_paterno,
        caballo.bisabuelo_pm,
        caballo.bisabuela_pm
      );

      agregar(
        caballo.abuela_materna,
        caballo.bisabuelo_mm,
        caballo.bisabuela_mm
      );
    }
  });

  return Array.from(encontrados.values())
    .sort((a, b) => a.Nombre.localeCompare(b.Nombre))
    .slice(0, 8);
}

    document.getElementById("nombreCaballo").addEventListener("keydown", function(event) {
  if (event.key === "Enter") {
    event.preventDefault();
    buscarCaballo();
  }
});
document.addEventListener("click", function(event) {
  const caja = event.target.closest(".pedigree-box[data-nombre]");

  if (!caja) return;

  const nombre = decodeURIComponent(caja.dataset.nombre);

  document.getElementById("nombreCaballo").value = nombre;

  buscarCaballo();

  window.scrollTo({
    top: 0,
    behavior: "smooth"
  });
});
</script>
